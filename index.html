      },

      populateCustomerSelects: function() {
        var el = document.getElementById('invCustomer');
        if (!el) return;
        DB.getAll('customers').then(function(customers) {
          el.innerHTML = '<option value="">-- Select Customer --</option>' +
            customers.map(function(c) { return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>'; }).join('');
          var opt = document.createElement('option');
          opt.value = 'new';
          opt.textContent = '➕ New Customer';
          el.appendChild(opt);
        });
        this.onCustomerChange();
      },

      onCustomerChange: function() {
        var sel = document.getElementById('invCustomer');
        var info = document.getElementById('invCustomerInfo');
        if (!sel || !info) return;
        var val = sel.value;
        if (val === 'new') { this.openNewCustomerModal(); return; }
        if (!val) { info.innerHTML = '<p class="text-muted">Select a customer to view details.</p>'; return; }
        var self = this;
        DB.get('customers', val).then(function(customer) {
          if (customer) {
            info.innerHTML = '<strong>' + escapeHtml(customer.name) + '</strong><br>' +
              (customer.company ? escapeHtml(customer.company) + '<br>' : '') +
              escapeHtml(customer.address || '') + '<br>Phone: ' + escapeHtml(customer.phone || '') +
              (customer.whatsapp ? ' | WhatsApp: ' + escapeHtml(customer.whatsapp) : '') +
              '<br>GSTIN: ' + escapeHtml(customer.gstin || 'N/A');
          } else {
            info.innerHTML = '<p class="text-muted">Customer not found.</p>';
          }
          self.calculate();
          self.updatePreview();
        });
      },

      openNewCustomerModal: function() {
        var origClose = H4Customers.closeModal;
        H4Customers.openModal();
        H4Customers.closeModal = function() {
          origClose.call(this);
          H4Invoice.populateCustomerSelects();
          var sel = document.getElementById('invCustomer');
          if (sel) {
            DB.getAll('customers').then(function(list) {
              if (list.length) {
                var last = list[list.length - 1];
                sel.value = last.id;
                H4Invoice.onCustomerChange();
              }
            });
          }
          H4Customers.closeModal = origClose;
        };
      },

      generateNumber: function() {
        var el = document.getElementById('invNumber');
        if (el) el.value = generateNumber('H4-INV');
        var dateEl = document.getElementById('invDate');
        if (dateEl) dateEl.value = new Date().toISOString().split('T')[0];
      },

      renderSteps: function() {
        var container = document.getElementById('invSteps');
        if (!container) return;
        var labels = ['Details', 'Customer', 'Items', 'Calculation', 'Payment', 'Notes'];
        var self = this;
        container.innerHTML = labels.map(function(label, i) {
          var step = i + 1;
          var cls = 'builder-step-chip';
          if (step === self.currentStep) cls += ' active';
          else if (step < self.currentStep) cls += ' done';
          return '<div class="' + cls + '" onclick="H4Invoice.goToStep(' + step + ')">' + step + '. ' + label + '</div>';
        }).join('');
        var counter = document.getElementById('invStepCounter');
        if (counter) counter.textContent = 'Step ' + this.currentStep + ' / ' + this.totalSteps;
      },

      goToStep: function(step) {
        if (step < 1 || step > this.totalSteps) return;
        this.currentStep = step;
        document.querySelectorAll('#invoiceForm .builder-step-section').forEach(function(el) {
          el.classList.toggle('active', parseInt(el.dataset.step) === step);
        });
        this.renderSteps();
        if (step === 4) { this.calculate(); }
        if (step === 6) { this.updatePreview(); }
        var target = document.querySelector('#invoiceForm .builder-step-section.active');
        if (target) {
          setTimeout(function() { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
        }
      },

      nextStep: function() { if (this.currentStep < this.totalSteps) { this.currentStep++; this.goToStep(this.currentStep); } },
      prevStep: function() { if (this.currentStep > 1) { this.currentStep--; this.goToStep(this.currentStep); } },

      onFieldChange: function() { this.calculate(); this.updatePreview(); },

      addItem: function() {
        var newId = this.items.length > 0 ? Math.max.apply(null, this.items.map(function(i) { return i.id; })) + 1 : 1;
        this.items.push({ id: newId, productId: '', description: '', quantity: 1, unit: 'Nos', rate: 0, gst: 18, discount: 0, hsn: '', rateSource: 'manual' });
        this.renderItems();
        this.calculate();
        this.updatePreview();
      },

      removeItem: function(idx) {
        this.items.splice(idx, 1);
        this.renderItems();
        this.calculate();
        this.updatePreview();
      },

      onProductSelect: function(idx, productId) {
        if (!productId) {
          this.items[idx].productId = '';
          this.items[idx].description = '';
          this.items[idx].unit = 'Nos';
          this.items[idx].rate = 0;
          this.items[idx].gst = 18;
          this.items[idx].hsn = '';
          this.renderItems();
          this.calculate();
          this.updatePreview();
          return;
        }
        var self = this;
        DB.get('products', productId).then(function(product) {
          if (!product) { toast('Product not found.', 'error'); return; }
          var qty = self.items[idx].quantity || 1;
          var rate = getPriceSlabRate(product, qty);
          self.items[idx].productId = productId;
          self.items[idx].description = product.name || '';
          self.items[idx].unit = product.unit || 'Nos';
          self.items[idx].rate = rate;
          self.items[idx].gst = product.gst || 18;
          self.items[idx].hsn = product.hsn || '';
          self.items[idx].rateSource = 'auto';
          self.renderItems();
          self.calculate();
          self.updatePreview();
          setTimeout(function() {
            var select = document.getElementById('invProductSelect_' + idx);
            if (select) select.value = productId;
          }, 0);
          toast('✅ Product rate: ₹' + rate.toFixed(2));
        });
      },

      updateItem: function(idx, field, value) {
        if (['quantity', 'rate', 'gst', 'discount'].indexOf(field) !== -1) { value = parseFloat(value) || 0; }
        this.items[idx][field] = value;
        if (field === 'quantity' && this.items[idx].productId) {
          var self = this;
          DB.get('products', this.items[idx].productId).then(function(product) {
            if (product && product.slabs && product.slabs.length > 0) {
              var newRate = getPriceSlabRate(product, value);
              self.items[idx].rate = newRate;
              self.items[idx].rateSource = 'auto-slab';
              self.renderItems();
              self.calculate();
              self.updatePreview();
            }
          });
        } else {
          this.renderItems();
          this.calculate();
          this.updatePreview();
        }
      },

      renderItems: function() {
        var container = document.getElementById('invoiceItemsContainer');
        if (!container) return;
        var self = this;
        DB.getAll('products').then(function(products) {
          var productOptions = products.filter(function(p) { return p.active !== false; }).map(function(p) {
            return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>';
          }).join('');
          if (self.items.length === 0) {
            container.innerHTML = '<p class="text-muted text-center" style="padding:1rem;">No items. Click "Add Item".</p>';
            return;
          }
          container.innerHTML = self.items.map(function(item, idx) {
            var total = (item.quantity || 0) * (item.rate || 0);
            var rateStatus = (item.rateSource === 'auto' || item.rateSource === 'auto-slab') ? '🤖 Auto' : '✏️ Manual';
            return '<div class="item-card"><div class="item-header"><span style="font-weight:600;">#' + (idx + 1) + ' ' + escapeHtml(item.description || 'New Item') + ' <small style="color:var(--text-muted);">' + rateStatus + '</small></span><button class="btn btn-sm btn-danger" onclick="H4Invoice.removeItem(' + idx + ')">✕</button></div><div class="item-grid"><div class="form-group"><label>Product</label><select id="invProductSelect_' + idx + '" onchange="H4Invoice.onProductSelect(' + idx + ', this.value)"><option value="">-- Select Product --</option>' + productOptions + '</select></div><div class="form-group"><label>Description</label><input value="' + escapeHtml(item.description) + '" onchange="H4Invoice.updateItem(' + idx + ', \'description\', this.value)"></div><div class="form-group"><label>Qty</label><input type="number" step="0.01" min="0" value="' + item.quantity + '" onchange="H4Invoice.updateItem(' + idx + ', \'quantity\', this.value)"></div><div class="form-group"><label>Unit</label><input value="' + escapeHtml(item.unit) + '" onchange="H4Invoice.updateItem(' + idx + ', \'unit\', this.value)"></div><div class="form-group"><label>Rate</label><input type="number" step="0.01" min="0" value="' + item.rate + '" onchange="H4Invoice.updateItem(' + idx + ', \'rate\', this.value); H4Invoice.items[' + idx + '].rateSource=\'manual\';"></div><div class="form-group"><label>GST %</label><input type="number" step="0.01" min="0" value="' + item.gst + '" onchange="H4Invoice.updateItem(' + idx + ', \'gst\', this.value)"></div><div class="form-group"><label>HSN</label><input value="' + escapeHtml(item.hsn || '') + '" onchange="H4Invoice.updateItem(' + idx + ', \'hsn\', this.value)"></div><div class="form-group"><label>Discount %</label><input type="number" step="0.01" min="0" value="' + (item.discount || 0) + '" onchange="H4Invoice.updateItem(' + idx + ', \'discount\', this.value)"></div></div><div class="item-total">Total: ₹' + total.toFixed(2) + '</div></div>';
          }).join('');
          self.items.forEach(function(item, idx) {
            var select = document.getElementById('invProductSelect_' + idx);
            if (select && item.productId) { select.value = item.productId; }
          });
        });
      },

      calculate: function() {
        var items = this.items.map(function(item) {
          return { quantity: item.quantity || 0, rate: item.rate || 0, discount: item.discount || 0, gst: item.gst || 0 };
        });
        var subtotal = 0,
          totalDiscount = 0;
        items.forEach(function(it) {
          var sub = it.quantity * it.rate;
          var disc = sub * (it.discount / 100);
          disc = Math.min(disc, sub);
          subtotal += sub;
          totalDiscount += disc;
        });
        var discVal = parseFloat(document.getElementById('invDiscountValue')?.value) || 0;
        var discountAmt = discVal > 0 ? subtotal * discVal / 100 : totalDiscount;
        discountAmt = Math.min(discountAmt, subtotal);
        var taxable = Math.max(0, subtotal - discountAmt);
        var taxMode = document.getElementById('invTaxMode')?.value || 'intra';
        var cgst = 0,
          sgst = 0,
          igst = 0;
        var self = this;
        DB.get('settings', 'app_settings').then(function(settings) {
          settings = settings || {};
          if (taxMode !== 'off' && settings.gstEnabled !== false) {
            var gstRate = items.length > 0 ? items[0].gst : (settings.gstRate || 18);
            var gstTotal = taxable * (gstRate / 100);
            if (taxMode === 'inter') { igst = gstTotal; } else { cgst = gstTotal / 2;
              sgst = gstTotal / 2; }
          }
          var beforeRound = taxable + cgst + sgst + igst;
          var grandTotal = Math.round(beforeRound);
          var roundOff = grandTotal - beforeRound;
          var setText = function(id, val) { var el = document.getElementById(id); if (el) el.textContent = '₹' + Number(val).toFixed(2); };
          setText('invSubtotal', subtotal);
          setText('invDiscountAmt', discountAmt);
          setText('invTaxable', taxable);
          setText('invCGST', cgst);
          setText('invSGST', sgst);
          setText('invIGST', igst);
          setText('invRoundOff', roundOff);
          setText('invGrandTotal', grandTotal);
          var wordsEl = document.getElementById('invAmountWords');
          if (wordsEl) wordsEl.textContent = 'Rupees ' + numberToWords(grandTotal) + ' Only';
          var cgstRow = document.getElementById('invCgstRow');
          var sgstRow = document.getElementById('invSgstRow');
          var igstRow = document.getElementById('invIgstRow');
          if (cgstRow) cgstRow.style.display = cgst > 0 ? 'flex' : 'none';
          if (sgstRow) sgstRow.style.display = sgst > 0 ? 'flex' : 'none';
          if (igstRow) igstRow.style.display = igst > 0 ? 'flex' : 'none';
          self._calcData = { subtotal: subtotal, discountAmount: discountAmt, taxableAmount: taxable, cgst: cgst, sgst: sgst, igst: igst, roundOff: roundOff, grandTotal: grandTotal, amountWords: 'Rupees ' + numberToWords(grandTotal) + ' Only' };
          self.updatePaymentStatus();
        });
      },

      updatePaymentStatus: function() {
        var paid = parseFloat(document.getElementById('invPaidAmount')?.value) || 0;
        var totalEl = document.getElementById('invGrandTotal');
        var total = 0;
        if (totalEl) { total = parseFloat(totalEl.textContent.replace('₹', '')) || 0; }
        var balance = Math.max(0, total - paid);
        var balanceEl = document.getElementById('invBalance');
        if (balanceEl) balanceEl.value = '₹' + balance.toFixed(2);
        var statusEl = document.getElementById('invPaymentStatus');
        if (statusEl) {
          var status = 'unpaid';
          if (total === 0) status = 'draft';
          else if (paid >= total) status = 'paid';
          else if (paid > 0) status = 'partial';
          statusEl.value = status;
        }
      },

      updatePreview: function() {
        var container = document.getElementById('invPreviewContainer');
        if (!container) return;
        var data = this.collectData();
        var calc = this._calcData || {};
        var self = this;
        DB.get('settings', 'app_settings').then(function(settings) {
          settings = settings || {};
          var templateId = settings.invoiceTemplate || 'tpl_premium';
          data.subtotal = calc.subtotal || 0;
          data.discountAmount = calc.discountAmount || 0;
          data.taxableAmount = calc.taxableAmount || 0;
          data.cgst = calc.cgst || 0;
          data.sgst = calc.sgst || 0;
          data.igst = calc.igst || 0;
          data.roundOff = calc.roundOff || 0;
          data.grandTotal = calc.grandTotal || 0;
          data.amountWords = calc.amountWords || 'Rupees Zero Only';
          data.gstMode = document.getElementById('invTaxMode')?.value || 'intra';
          H4Template.renderInvoice(data, templateId).then(function(html) {
            container.innerHTML = html;
          });
        });
      },

      collectData: function() {
        var customerId = document.getElementById('invCustomer')?.value || '';
        return {
          id: this.editingId || 'inv_' + Date.now(),
          number: document.getElementById('invNumber')?.value || '',
          date: document.getElementById('invDate')?.value || '',
          dueDate: document.getElementById('invDueDate')?.value || '',
          customerId: customerId === 'new' ? '' : customerId,
          customerName: '',
          projectName: document.getElementById('invProject')?.value || '',
          reference: document.getElementById('invReference')?.value || '',
          items: JSON.parse(JSON.stringify(this.items)),
          paidAmount: parseFloat(document.getElementById('invPaidAmount')?.value) || 0,
          paymentStatus: document.getElementById('invPaymentStatus')?.value || 'unpaid',
          terms: document.getElementById('invTerms')?.value || '',
          bankDetails: document.getElementById('invBankDetails')?.value || '',
          notes: document.getElementById('invNotes')?.value || '',
          gstMode: document.getElementById('invTaxMode')?.value || 'intra',
          updatedAt: new Date().toISOString()
        };
      },

      saveInvoice: function() {
        var data = this.collectData();
        if (!data.customerId || data.customerId === 'new') { toast('Please select a customer.', 'error'); this.goToStep(2); return; }
        if (this.items.length === 0) { toast('Please add at least one item.', 'error'); this.goToStep(3); return; }
        var self = this;
        DB.get('customers', data.customerId).then(function(customer) {
          data.customerName = customer ? customer.name : '';
          self.calculate();
          var calc = self._calcData || {};
          data.subtotal = calc.subtotal || 0;
          data.discountAmount = calc.discountAmount || 0;
          data.taxableAmount = calc.taxableAmount || 0;
          data.cgst = calc.cgst || 0;
          data.sgst = calc.sgst || 0;
          data.igst = calc.igst || 0;
          data.roundOff = calc.roundOff || 0;
          data.grandTotal = calc.grandTotal || 0;
          data.amountWords = calc.amountWords || 'Rupees Zero Only';
          if (self.editingId) {
            DB.put('invoices', data).then(function() {
              toast('Invoice updated!');
              H4App.navigate('invoices');
            });
          } else {
            DB.put('invoices', data).then(function() {
              toast('✅ Invoice saved: ' + data.number);
              H4App.navigate('invoices');
            });
          }
        });
      },

      viewInvoice: function(id) {
        var self = this;
        DB.get('invoices', id).then(function(inv) {
          if (!inv) { toast('Invoice not found.', 'error'); return; }
          DB.get('settings', 'app_settings').then(function(settings) {
            settings = settings || {};
            var templateId = settings.invoiceTemplate || 'tpl_premium';
            H4Template.renderInvoice(inv, templateId).then(function(html) {
              var modal = document.createElement('div');
              modal.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.7);overflow:auto;padding:20px;backdrop-filter:blur(4px);';
              modal.innerHTML = '<div style="max-width:900px;margin:20px auto;background:var(--card-bg);border-radius:12px;overflow:hidden;"><div style="padding:12px 20px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;display:flex;justify-content:space-between;align-items:center;"><strong>🧾 Invoice: ' + escapeHtml(inv.number) + '</strong><div><button class="btn btn-success" onclick="H4Invoice.printInvoiceById(\'' + id + '\')">🖨️ Print</button><button class="btn btn-danger" onclick="this.closest(\'div\').parentElement.remove()">✕ Close</button></div></div><div style="padding:20px;">' + html + '</div></div>';
              document.body.appendChild(modal);
            });
          });
        });
      },

        if (this.items.length === 0) { toast('Please add at least one item.', 'error'); return; }

              win.document.close();

      whatsappInvoice: function() {
        var data = this.collectData();
        if (!data.customerId || data.customerId === 'new') { toast('Please select a customer.', 'error'); return; }
        var self = this;
        DB.get('customers', data.customerId).then(function(customer) {
          var phone = customer ? (customer.whatsapp || customer.phone) : '';
          if (!phone) { toast('Customer WhatsApp number not available.', 'warning'); return; }
          var total = document.getElementById('invGrandTotal')?.textContent || '₹0.00';
          var msg = 'Dear ' + (customer ? customer.name : 'Customer') + ',\n\nPlease find your invoice.\n\nInvoice No: ' + data.number + '\nAmount: ' + total + '\n\nThank you for your business.\n\n' + ((DB.get('settings') || {}).brandName || 'H4 Construction Solutions');
          var url = 'https://wa.me/' + phone.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
          window.open(url, '_blank');
        });
      },

      whatsappExistingInvoice: function(id) {
        var self = this;
        DB.get('invoices', id).then(function(inv) {
          if (!inv) { toast('Invoice not found.', 'error'); return; }
          var customerId = inv.customerId;
          if (!customerId) { toast('No customer linked.', 'warning'); return; }
          DB.get('customers', customerId).then(function(customer) {
            var phone = customer ? (customer.whatsapp || customer.phone) : '';
            if (!phone) { toast('Customer WhatsApp number not available.', 'warning'); return; }
            var msg = 'Dear ' + (customer ? customer.name : 'Customer') + ',\n\nPlease find your invoice.\n\nInvoice No: ' + inv.number + '\nAmount: ₹' + Number(inv.grandTotal || 0).toFixed(2) + '\n\nThank you for your business.\n\n' + ((DB.get('settings') || {}).brandName || 'H4 Construction Solutions');
            var url = 'https://wa.me/' + phone.replace(/\D/g, '') + '?text=' + encodeURIComponent(msg);
            window.open(url, '_blank');
          });
        });
      },

      editInvoice: function(id) {
        var self = this;
        DB.get('invoices', id).then(function(inv) {
          if (!inv) { toast('Invoice not found.', 'error'); return; }
          self.editingId = id;
          self.items = JSON.parse(JSON.stringify(inv.items || []));
          self.currentStep = 1;
          self._calcData = {};
          var container = document.getElementById('mainContent');
          if (!container) return;
          container.innerHTML = self.renderForm();
          document.getElementById('invNumber').value = inv.number || '';
          document.getElementById('invDate').value = inv.date || '';
          document.getElementById('invDueDate').value = inv.dueDate || '';
          document.getElementById('invCustomer').value = inv.customerId || '';
          document.getElementById('invProject').value = inv.projectName || '';
          document.getElementById('invReference').value = inv.reference || '';
          document.getElementById('invNotes').value = inv.notes || '';
          document.getElementById('invTerms').value = inv.terms || '';
          document.getElementById('invBankDetails').value = inv.bankDetails || '';
          document.getElementById('invPaidAmount').value = inv.paidAmount || 0;
          document.getElementById('invPaymentStatus').value = inv.paymentStatus || 'unpaid';
          self.populateCustomerSelects();
          self.renderItems();
          self.calculate();
          self.updatePreview();
          self.renderSteps();
          self.goToStep(1);
          toast('Editing invoice: ' + inv.number);
        });
      }
    };
