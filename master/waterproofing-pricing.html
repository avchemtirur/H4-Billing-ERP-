<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>H4 – Waterproofing Pricing Master</title>

    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/mobile.css" />
    <link rel="stylesheet" href="../../css/desktop.css" />

    <style>
        /* ----- base ----- */
        .master-container {
            max-width: 1300px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
        }

        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .master-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
        }
        .master-header h1 span {
            color: #3182ce;
        }
        .master-header .sub {
            color: #718096;
            font-size: 0.9rem;
            font-weight: 400;
            margin-top: 0.1rem;
        }

        /* ----- tabs ----- */
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            background: #f7fafc;
            padding: 0.4rem 0.4rem 0;
            border-radius: 12px 12px 0 0;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            position: relative;
        }
        .tab-btn:hover {
            background: #edf2f7;
        }
        .tab-btn.active {
            background: #fff;
            color: #3182ce;
            box-shadow: 0 -2px 0 #3182ce;
        }
        .tab-btn .badge {
            background: #3182ce;
            color: #fff;
            border-radius: 20px;
            padding: 0.1rem 0.6rem;
            font-size: 0.7rem;
            margin-left: 0.4rem;
        }

        .tab-panel {
            display: none;
            background: #fff;
            border-radius: 0 0 12px 12px;
            padding: 1.5rem 0.5rem 0.5rem;
            border: 1px solid #e2e8f0;
            border-top: none;
        }
        .tab-panel.active {
            display: block;
        }

        .panel-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .panel-toolbar .search-box {
            flex: 1 1 260px;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: #f7fafc;
            border-radius: 8px;
            padding: 0.2rem 0.8rem;
            border: 1px solid #e2e8f0;
        }
        .panel-toolbar .search-box input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }
        .panel-toolbar .search-box span {
            color: #a0aec0;
        }

        .btn-primary {
            background: #3182ce;
            color: #fff;
            border: none;
            padding: 0.55rem 1.4rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #2b6cb0;
        }

        .btn-secondary {
            background: #edf2f7;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: #fc8181;
            color: #fff;
            border: none;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-danger:hover {
            background: #f56565;
        }
        .btn-edit {
            background: #edf2f7;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .btn-edit:hover {
            background: #e2e8f0;
        }

        /* ----- table card ----- */
        .table-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #edf2f7;
        }
        .table-wrapper {
            overflow-x: auto;
            padding: 0.2rem 0.2rem 0.2rem 0.2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 600px;
        }
        thead {
            background: #f7fafc;
            border-bottom: 2px solid #e2e8f0;
        }
        th {
            text-align: left;
            padding: 0.8rem 0.8rem;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }

        .badge-status {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #c6f6d5;
            color: #276749;
        }
        .badge-status.inactive {
            background: #fed7d7;
            color: #9b2c2c;
        }

        .empty-row td {
            text-align: center;
            color: #a0aec0;
            padding: 2.5rem 1rem;
            font-style: italic;
        }

        /* ----- modal (reuse) ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 720px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            padding: 1.8rem 2rem 1.8rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .modal-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: #a0aec0;
            cursor: pointer;
            padding: 0 0.3rem;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #4a5568;
        }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #2d3748;
            margin-bottom: 0.25rem;
        }
        .form-group label .required {
            color: #e53e3e;
            margin-left: 0.1rem;
        }
        .form-group .hint {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 0.15rem;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.55rem 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-check {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }
        .form-check input[type="checkbox"] {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: #3182ce;
            cursor: pointer;
        }
        .form-check label {
            font-weight: 500;
            color: #2d3748;
            margin: 0;
            cursor: pointer;
        }

        /* system checkboxes for applicable systems */
        .system-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            margin-top: 0.3rem;
        }
        .system-checkboxes label {
            font-weight: 400;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .system-checkboxes input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            accent-color: #3182ce;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.8rem;
            padding-top: 1rem;
            border-top: 1px solid #edf2f7;
        }
        .btn-cancel {
            background: #edf2f7;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            padding: 0.5rem 1.6rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-cancel:hover {
            background: #e2e8f0;
        }
        .btn-save {
            background: #3182ce;
            color: #fff;
            border: none;
            padding: 0.5rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save:hover {
            background: #2b6cb0;
        }

        /* ----- toast ----- */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: #fff;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s ease;
            border-left: 5px solid #3182ce;
            min-width: 200px;
        }
        .toast.success { border-left-color: #48bb78; }
        .toast.error { border-left-color: #fc8181; }
        .toast .close {
            margin-left: auto;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #a0aec0;
            cursor: pointer;
        }
        .toast .close:hover {
            color: #4a5568;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ----- responsive ----- */
        @media (max-width: 640px) {
            .master-container { padding: 0 0.8rem; }
            .master-header { flex-direction: column; align-items: flex-start; }
            .tab-btn { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
            .modal { padding: 1.2rem; }
            .form-row { grid-template-columns: 1fr; }
            .panel-toolbar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="h4-header">
        <a href="../../index.html" class="brand" id="brandLink">
            <span class="brand-icon">⚜️</span>
            <span class="brand-name">H4 <span>ERP</span></span>
        </a>
        <div class="header-actions">
            <button class="btn" id="backBtn">← Back</button>
            <button class="btn btn-primary-header" id="dashboardBtn">🏠 Dashboard</button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="master-container">

        <div class="master-header">
            <div>
                <h1>💧 <span>Waterproofing</span> Pricing Master</h1>
                <div class="sub">Admin · Base Rate · Options · Warranty</div>
            </div>
            <div>
                <button class="btn-secondary" id="refreshBtn">⟳ Refresh</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-tab="systems">📋 Base Rates <span class="badge" id="systemsCount">0</span></button>
            <button class="tab-btn" data-tab="options">⚙️ Options <span class="badge" id="optionsCount">0</span></button>
            <button class="tab-btn" data-tab="warranties">🛡️ Warranty <span class="badge" id="warrantiesCount">0</span></button>
        </div>

        <!-- ========================================================== -->
        <!-- TAB: SYSTEMS -->
        <!-- ========================================================== -->
        <div class="tab-panel active" id="panelSystems">
            <div class="panel-toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchSystems" placeholder="Search systems..." />
                </div>
                <button class="btn-primary" id="addSystemBtn">＋ Add System</button>
            </div>
            <div class="table-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>System</th>
                                <th>Code</th>
                                <th>Method</th>
                                <th>Base Rate</th>
                                <th>Unit</th>
                                <th>Status</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="systemsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========================================================== -->
        <!-- TAB: OPTIONS -->
        <!-- ========================================================== -->
        <div class="tab-panel" id="panelOptions">
            <div class="panel-toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchOptions" placeholder="Search options..." />
                </div>
                <button class="btn-primary" id="addOptionBtn">＋ Add Option</button>
            </div>
            <div class="table-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Option</th>
                                <th>Method</th>
                                <th>Rate</th>
                                <th>Unit</th>
                                <th>Applies To</th>
                                <th>Status</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="optionsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========================================================== -->
        <!-- TAB: WARRANTIES -->
        <!-- ========================================================== -->
        <div class="tab-panel" id="panelWarranties">
            <div class="panel-toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchWarranties" placeholder="Search warranties..." />
                </div>
                <button class="btn-primary" id="addWarrantyBtn">＋ Add Warranty</button>
            </div>
            <div class="table-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Period</th>
                                <th>Method</th>
                                <th>Add. Rate</th>
                                <th>Unit</th>
                                <th>Applies To</th>
                                <th>Status</th>
                                <th style="text-align:right;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="warrantiesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================================== -->
    <!-- MODAL (reused for all) -->
    <!-- ========================================================== -->
    <div class="modal-overlay" id="genericModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add / Edit</h2>
                <button class="modal-close" id="modalCloseBtn">✕</button>
            </div>
            <form id="genericForm" autocomplete="off">
                <div id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="modalCancelBtn">Cancel</button>
                    <button type="submit" class="btn-save" id="modalSaveBtn">💾 Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ========================================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================== -->
    <script>
        (function() {
            'use strict';

            // -------------------- STORAGE KEYS --------------------
            const KEYS = {
                systems: 'waterproofingSystems',
                options: 'waterproofingOptions',
                warranties: 'waterproofingWarranties'
            };

            // -------------------- HELPERS --------------------
            function getData(key) {
                try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; }
            }
            function setData(key, data) {
                localStorage.setItem(key, JSON.stringify(data));
            }
            function generateId(list) {
                return list.length ? Math.max(...list.map(i => i.id || 0)) + 1 : 1;
            }
            function escapeHtml(text) {
                if (!text) return '';
                return String(text).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m] || m));
            }
            function showToast(msg, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
                toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${msg}</span><button class="close">✕</button>`;
                container.appendChild(toast);
                const close = toast.querySelector('.close');
                close.addEventListener('click', () => toast.remove());
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(40px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }

            // -------------------- MODAL CONTROLS --------------------
            const modal = document.getElementById('genericModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const form = document.getElementById('genericForm');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');

            let currentEntityType = null; // 'system', 'option', 'warranty'
            let editId = null;

            function openModal(title, html, type, id = null) {
                modalTitle.textContent = title;
                modalBody.innerHTML = html;
                currentEntityType = type;
                editId = id;
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                // attach any dynamic events after render
                setTimeout(() => {
                    // if system, attach auto-code
                    if (type === 'system') {
                        const autoBtn = document.getElementById('autoCodeBtn');
                        if (autoBtn) autoBtn.addEventListener('click', autoGenerateCode);
                        const methodSelect = document.getElementById('sysPricingMethod');
                        if (methodSelect) methodSelect.addEventListener('change', updateUnitField);
                        updateUnitField();
                    }
                    // if option or warranty, we may need to refresh system list
                }, 50);
            }

            function closeModal() {
                modal.classList.remove('open');
                document.body.style.overflow = '';
                currentEntityType = null;
                editId = null;
                form.reset();
                modalBody.innerHTML = '';
            }

            modalCloseBtn.addEventListener('click', closeModal);
            modalCancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

            // -------------------- SYSTEM MASTER --------------------
            function getSystems() { return getData(KEYS.systems); }
            function saveSystems(list) { setData(KEYS.systems, list); }

            function renderSystems() {
                const list = getSystems();
                const tbody = document.getElementById('systemsTableBody');
                const search = document.getElementById('searchSystems').value.toLowerCase().trim();
                const filtered = list.filter(s => (s.name || '').toLowerCase().includes(search) || (s.code || '').toLowerCase()
                    .includes(search));
                document.getElementById('systemsCount').textContent = filtered.length;

                if (filtered.length === 0) {
                    tbody.innerHTML =
                        `<tr class="empty-row"><td colspan="7">No systems found. Click "Add System" to create one.</td></tr>`;
                    return;
                }
                let html = '';
                filtered.forEach(sys => {
                    const statusClass = sys.active !== false ? 'active' : 'inactive';
                    const statusLabel = sys.active !== false ? 'Active' : 'Inactive';
                    html += `
                        <tr>
                            <td><strong>${escapeHtml(sys.name)}</strong></td>
                            <td><code style="background:#edf2f7;padding:0.1rem 0.4rem;border-radius:4px;">${escapeHtml(sys.code)}</code></td>
                            <td>${escapeHtml(sys.pricingMethod)}</td>
                            <td>₹ ${parseFloat(sys.baseRate || 0).toFixed(2)}</td>
                            <td>${escapeHtml(sys.unit || sys.pricingMethod)}</td>
                            <td><span class="badge-status ${statusClass}">${statusLabel}</span></td>
                            <td style="text-align:right;">
                                <button class="btn-edit" data-id="${sys.id}">✎</button>
                                <button class="btn-danger" data-id="${sys.id}">✕</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

                // attach events
                tbody.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => editSystem(parseInt(b.dataset
                .id))));
                tbody.querySelectorAll('.btn-danger').forEach(b => b.addEventListener('click', () => deleteSystem(parseInt(b
                    .dataset.id))));
            }

            function deleteSystem(id) {
                if (!confirm('Delete this system permanently? This may affect options/warranties.')) return;
                let list = getSystems();
                const newList = list.filter(s => s.id !== id);
                if (newList.length === list.length) { showToast('System not found.', 'error'); return; }
                saveSystems(newList);
                renderSystems();
                renderOptions(); // refresh applicable systems in option list
                renderWarranties();
                showToast('🗑️ System deleted.', 'success');
            }

            function editSystem(id) {
                const list = getSystems();
                const sys = list.find(s => s.id === id);
                if (!sys) { showToast('System not found.', 'error'); return; }
                // build form
                const html = buildSystemForm(sys);
                openModal('✎ Edit Waterproofing System', html, 'system', id);
            }

            function buildSystemForm(data = null) {
                const d = data || {};
                const methods = ['Sq.ft', 'Sq.m', 'Running Ft', 'Kg', 'Litre', 'Nos', 'Lump Sum', 'Percentage'];
                const methodOpts = methods.map(m => `<option value="${m}" ${m === d.pricingMethod ? 'selected':''}>${m}</option>`)
                    .join('');

                return `
                    <div class="form-group">
                        <label>System Name <span class="required">*</span></label>
                        <input type="text" id="sysName" value="${escapeHtml(d.name||'')}" placeholder="e.g. H4 Premium Terrace" required />
                    </div>
                    <div class="form-group">
                        <label>System Code <span class="required">*</span></label>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <input type="text" id="sysCode" value="${escapeHtml(d.code||'')}" placeholder="e.g. H4-WP-TERR" required style="flex:1;" />
                            <button type="button" class="btn-secondary" id="autoCodeBtn" style="white-space:nowrap;">⟳ Auto</button>
                        </div>
                        <div class="hint">Unique identifier. Click Auto to generate from name.</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pricing Method <span class="required">*</span></label>
                            <select id="sysPricingMethod" required>${methodOpts}</select>
                        </div>
                        <div class="form-group">
                            <label>Base Rate (₹) <span class="required">*</span></label>
                            <input type="number" id="sysBaseRate" value="${d.baseRate!==undefined ? d.baseRate : ''}" placeholder="e.g. 25" step="0.01" min="0" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <input type="text" id="sysUnit" value="${escapeHtml(d.unit||d.pricingMethod||'')}" readonly style="background:#f7fafc;" />
                        <div class="hint">Auto-filled from Pricing Method.</div>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="sysActive" ${d.active !== false ? 'checked' : ''} />
                        <label for="sysActive">Active</label>
                    </div>

                    <hr style="margin:1.2rem 0;" />
                    <h4 style="margin-bottom:0.5rem;">Advanced Specifications</h4>
                    <div class="form-group">
                        <label>Brand</label>
                        <input type="text" id="sysBrand" value="${escapeHtml(d.brand||'')}" placeholder="e.g. H4, Sika" />
                    </div>
                    <div class="form-group">
                        <label>Grade</label>
                        <input type="text" id="sysGrade" value="${escapeHtml(d.grade||'')}" placeholder="e.g. Premium" />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Thickness (mm)</label>
                            <input type="number" id="sysThickness" value="${d.thickness!==undefined ? d.thickness : ''}" step="0.1" min="0" />
                        </div>
                        <div class="form-group">
                            <label>Number of Coats</label>
                            <input type="number" id="sysCoats" value="${d.coats!==undefined ? d.coats : ''}" step="1" min="0" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Coverage (per unit)</label>
                        <input type="text" id="sysCoverage" value="${escapeHtml(d.coverage||'')}" placeholder="e.g. 1.5 Sq.ft/kg" />
                    </div>
                    <div class="form-group">
                        <label>Mixing Ratio</label>
                        <input type="text" id="sysMixingRatio" value="${escapeHtml(d.mixingRatio||'')}" placeholder="e.g. 1:1" />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Recoat Time (hours)</label>
                            <input type="number" id="sysRecoatTime" value="${d.recoatTime!==undefined ? d.recoatTime : ''}" step="0.5" min="0" />
                        </div>
                        <div class="form-group">
                            <label>Curing Time (days)</label>
                            <input type="number" id="sysCuringTime" value="${d.curingTime!==undefined ? d.curingTime : ''}" step="1" min="0" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="sysDescription" rows="2">${escapeHtml(d.description||'')}</textarea>
                    </div>
                `;
            }

            function updateUnitField() {
                const method = document.getElementById('sysPricingMethod');
                const unit = document.getElementById('sysUnit');
                if (method && unit) unit.value = method.value;
            }

            function autoGenerateCode() {
                const name = document.getElementById('sysName');
                const code = document.getElementById('sysCode');
                if (!name.value.trim()) { showToast('Enter System Name first.', 'warning'); return; }
                const clean = name.value.trim().toUpperCase().replace(/[^A-Z0-9 ]/g, '').split(/\s+/).filter(w => w.length > 0);
                let gen = 'H4-WP-';
                if (clean.length === 1) gen += clean[0];
                else if (clean.length >= 2) gen += clean.slice(0, 3).map(w => w[0]).join('');
                else gen += 'SYS';
                code.value = gen;
            }

            // ----- handle system form submit -----
            function handleSystemSubmit(e) {
                e.preventDefault();
                const name = document.getElementById('sysName').value.trim();
                const code = document.getElementById('sysCode').value.trim();
                const method = document.getElementById('sysPricingMethod').value;
                const baseRate = parseFloat(document.getElementById('sysBaseRate').value);
                const active = document.getElementById('sysActive').checked;
                const unit = document.getElementById('sysUnit').value || method;

                if (!name) { showToast('System Name is required.', 'warning'); return; }
                if (!code) { showToast('System Code is required.', 'warning'); return; }
                if (isNaN(baseRate) || baseRate < 0) { showToast('Valid Base Rate is required.', 'warning'); return; }

                const list = getSystems();
                // check duplicate code (ignore self)
                const dup = list.find(s => s.code && s.code.toUpperCase() === code.toUpperCase() && s.id !== editId);
                if (dup) { showToast('⚠️ Code "' + code + '" already exists.', 'error'); return; }

                const sysObj = {
                    id: editId || generateId(list),
                    name,
                    code,
                    pricingMethod: method,
                    baseRate,
                    unit,
                    active,
                    brand: document.getElementById('sysBrand').value.trim(),
                    grade: document.getElementById('sysGrade').value.trim(),
                    thickness: parseFloat(document.getElementById('sysThickness').value) || 0,
                    coats: parseInt(document.getElementById('sysCoats').value) || 0,
                    coverage: document.getElementById('sysCoverage').value.trim(),
                    mixingRatio: document.getElementById('sysMixingRatio').value.trim(),
                    recoatTime: parseFloat(document.getElementById('sysRecoatTime').value) || 0,
                    curingTime: parseFloat(document.getElementById('sysCuringTime').value) || 0,
                    description: document.getElementById('sysDescription').value.trim(),
                    updatedAt: new Date().toISOString()
                };

                if (editId) {
                    const idx = list.findIndex(s => s.id === editId);
                    if (idx === -1) { showToast('System not found.', 'error'); return; }
                    list[idx] = { ...list[idx], ...sysObj };
                    showToast('✅ System updated.', 'success');
                } else {
                    sysObj.createdAt = new Date().toISOString();
                    list.push(sysObj);
                    showToast('✅ System added.', 'success');
                }
                saveSystems(list);
                closeModal();
                renderSystems();
                renderOptions(); // update applicable list
                renderWarranties();
            }

            // -------------------- OPTION MASTER --------------------
            function getOptions() { return getData(KEYS.options); }
            function saveOptions(list) { setData(KEYS.options, list); }

            function renderOptions() {
                const list = getOptions();
                const search = document.getElementById('searchOptions').value.toLowerCase().trim();
                const systems = getSystems();
                const filtered = list.filter(o => (o.name || '').toLowerCase().includes(search) || (o.displayName || '')
                    .toLowerCase().includes(search));
                document.getElementById('optionsCount').textContent = filtered.length;
                const tbody = document.getElementById('optionsTableBody');

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No options. Add an option.</td></tr>`;
                    return;
                }
                let html = '';
                filtered.forEach(opt => {
                    const statusClass = opt.active !== false ? 'active' : 'inactive';
                    const statusLabel = opt.active !== false ? 'Active' : 'Inactive';
                    // applicable systems text
                    let applies = 'All Systems';
                    if (opt.applicableSystems && opt.applicableSystems.length > 0 && !opt.applicableSystems.includes('all')) {
                        const names = opt.applicableSystems.map(id => {
                            const sys = systems.find(s => s.id === id);
                            return sys ? sys.name : '?';
                        }).filter(Boolean);
                        applies = names.join(', ') || 'None';
                    } else if (opt.applicableSystems && opt.applicableSystems.includes('all')) {
                        applies = 'All Systems';
                    } else {
                        applies = 'None';
                    }
                    html += `
                        <tr>
                            <td><strong>${escapeHtml(opt.name)}</strong>${opt.displayName ? `<br><small style="color:#718096;">${escapeHtml(opt.displayName)}</small>` : ''}</td>
                            <td>${escapeHtml(opt.pricingMethod)}</td>
                            <td>₹ ${parseFloat(opt.rate || 0).toFixed(2)}</td>
                            <td>${escapeHtml(opt.pricingMethod)}</td>
                            <td style="font-size:0.8rem;">${escapeHtml(applies)}</td>
                            <td><span class="badge-status ${statusClass}">${statusLabel}</span></td>
                            <td style="text-align:right;">
                                <button class="btn-edit" data-id="${opt.id}">✎</button>
                                <button class="btn-danger" data-id="${opt.id}">✕</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
                tbody.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => editOption(parseInt(b.dataset
                    .id))));
                tbody.querySelectorAll('.btn-danger').forEach(b => b.addEventListener('click', () => deleteOption(parseInt(b
                    .dataset.id))));
            }

            function deleteOption(id) {
                if (!confirm('Delete this option?')) return;
                let list = getOptions();
                const newList = list.filter(o => o.id !== id);
                if (newList.length === list.length) { showToast('Option not found.', 'error'); return; }
                saveOptions(newList);
                renderOptions();
                showToast('🗑️ Option deleted.', 'success');
            }

            function editOption(id) {
                const list = getOptions();
                const opt = list.find(o => o.id === id);
                if (!opt) { showToast('Option not found.', 'error'); return; }
                const html = buildOptionForm(opt);
                openModal('✎ Edit Option', html, 'option', id);
            }

            function buildOptionForm(data = null) {
                const d = data || {};
                const methods = ['Sq.ft', 'Sq.m', 'Running Ft', 'Kg', 'Litre', 'Nos', 'Lump Sum', 'Percentage'];
                const methodOpts = methods.map(m => `<option value="${m}" ${m === d.pricingMethod ? 'selected':''}>${m}</option>`)
                    .join('');

                // system checkboxes
                const systems = getSystems();
                let sysCheckboxes = '';
                if (systems.length === 0) {
                    sysCheckboxes = '<p style="color:#a0aec0;">No systems defined yet. Please add a system first.</p>';
                } else {
                    const selected = d.applicableSystems || [];
                    const allChecked = selected.includes('all') ? 'checked' : '';
                    sysCheckboxes = `
                        <div class="form-check" style="margin-bottom:0.5rem;">
                            <input type="checkbox" id="optApplyAll" ${allChecked} />
                            <label for="optApplyAll"><strong>All Systems</strong></label>
                        </div>
                        <div class="system-checkboxes">
                            ${systems.map(sys => `
                                <label>
                                    <input type="checkbox" class="opt-system-check" value="${sys.id}" ${selected.includes(sys.id) ? 'checked' : ''} />
                                    ${escapeHtml(sys.name)}
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                return `
                    <div class="form-group">
                        <label>Option Name <span class="required">*</span></label>
                        <input type="text" id="optName" value="${escapeHtml(d.name||'')}" placeholder="e.g. UV Protection" required />
                    </div>
                    <div class="form-group">
                        <label>Customer Display Name</label>
                        <input type="text" id="optDisplayName" value="${escapeHtml(d.displayName||'')}" placeholder="e.g. UV Protective Coating" />
                        <div class="hint">Optional. Shown on customer PDF if different from internal name.</div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pricing Method <span class="required">*</span></label>
                            <select id="optPricingMethod" required>${methodOpts}</select>
                        </div>
                        <div class="form-group">
                            <label>Rate (₹) <span class="required">*</span></label>
                            <input type="number" id="optRate" value="${d.rate!==undefined ? d.rate : ''}" step="0.01" min="0" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Applicable Systems</label>
                        ${sysCheckboxes}
                        <div class="hint">Select systems this option applies to. If none selected, it will not appear in quotation for any system.</div>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="optActive" ${d.active !== false ? 'checked' : ''} />
                        <label for="optActive">Active</label>
                    </div>
                `;
            }

            function handleOptionSubmit(e) {
                e.preventDefault();
                const name = document.getElementById('optName').value.trim();
                const displayName = document.getElementById('optDisplayName').value.trim();
                const method = document.getElementById('optPricingMethod').value;
                const rate = parseFloat(document.getElementById('optRate').value);
                const active = document.getElementById('optActive').checked;

                if (!name) { showToast('Option Name is required.', 'warning'); return; }
                if (isNaN(rate) || rate < 0) { showToast('Valid Rate is required.', 'warning'); return; }

                // get selected systems
                const allCheck = document.getElementById('optApplyAll');
                let applicableSystems = [];
                if (allCheck && allCheck.checked) {
                    applicableSystems = ['all'];
                } else {
                    document.querySelectorAll('.opt-system-check:checked').forEach(cb => {
                        applicableSystems.push(parseInt(cb.value));
                    });
                }

                const list = getOptions();
                // check duplicate name? allow same name? We'll allow but warn? We'll enforce unique name per option.
                const dup = list.find(o => o.name && o.name.toLowerCase() === name.toLowerCase() && o.id !== editId);
                if (dup) { showToast('⚠️ Option name already exists.', 'error'); return; }

                const optObj = {
                    id: editId || generateId(list),
                    name,
                    displayName,
                    pricingMethod: method,
                    rate,
                    applicableSystems,
                    active,
                    updatedAt: new Date().toISOString()
                };

                if (editId) {
                    const idx = list.findIndex(o => o.id === editId);
                    if (idx === -1) { showToast('Option not found.', 'error'); return; }
                    list[idx] = { ...list[idx], ...optObj };
                    showToast('✅ Option updated.', 'success');
                } else {
                    optObj.createdAt = new Date().toISOString();
                    list.push(optObj);
                    showToast('✅ Option added.', 'success');
                }
                saveOptions(list);
                closeModal();
                renderOptions();
            }

            // -------------------- WARRANTY MASTER --------------------
            function getWarranties() { return getData(KEYS.warranties); }
            function saveWarranties(list) { setData(KEYS.warranties, list); }

            function renderWarranties() {
                const list = getWarranties();
                const search = document.getElementById('searchWarranties').value.toLowerCase().trim();
                const systems = getSystems();
                const filtered = list.filter(w => (w.years || '').toString().includes(search));
                document.getElementById('warrantiesCount').textContent = filtered.length;
                const tbody = document.getElementById('warrantiesTableBody');

                if (filtered.length === 0) {
                    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No warranties. Add a warranty.</td></tr>`;
                    return;
                }
                let html = '';
                filtered.forEach(warr => {
                    const statusClass = warr.active !== false ? 'active' : 'inactive';
                    const statusLabel = warr.active !== false ? 'Active' : 'Inactive';
                    let applies = 'All Systems';
                    if (warr.applicableSystems && warr.applicableSystems.length > 0 && !warr.applicableSystems.includes(
                        'all')) {
                        const names = warr.applicableSystems.map(id => {
                            const sys = systems.find(s => s.id === id);
                            return sys ? sys.name : '?';
                        }).filter(Boolean);
                        applies = names.join(', ') || 'None';
                    } else if (warr.applicableSystems && warr.applicableSystems.includes('all')) {
                        applies = 'All Systems';
                    } else {
                        applies = 'None';
                    }
                    html += `
                        <tr>
                            <td><strong>${escapeHtml(warr.years)} Years</strong></td>
                            <td>${escapeHtml(warr.pricingMethod || 'Sq.ft')}</td>
                            <td>₹ ${parseFloat(warr.additionalRate || 0).toFixed(2)}</td>
                            <td>${escapeHtml(warr.pricingMethod || 'Sq.ft')}</td>
                            <td style="font-size:0.8rem;">${escapeHtml(applies)}</td>
                            <td><span class="badge-status ${statusClass}">${statusLabel}</span></td>
                            <td style="text-align:right;">
                                <button class="btn-edit" data-id="${warr.id}">✎</button>
                                <button class="btn-danger" data-id="${warr.id}">✕</button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;
                tbody.querySelectorAll('.btn-edit').forEach(b => b.addEventListener('click', () => editWarranty(parseInt(b
                    .dataset.id))));
                tbody.querySelectorAll('.btn-danger').forEach(b => b.addEventListener('click', () => deleteWarranty(parseInt(
                    b.dataset.id))));
            }

            function deleteWarranty(id) {
                if (!confirm('Delete this warranty?')) return;
                let list = getWarranties();
                const newList = list.filter(w => w.id !== id);
                if (newList.length === list.length) { showToast('Warranty not found.', 'error'); return; }
                saveWarranties(newList);
                renderWarranties();
                showToast('🗑️ Warranty deleted.', 'success');
            }

            function editWarranty(id) {
                const list = getWarranties();
                const warr = list.find(w => w.id === id);
                if (!warr) { showToast('Warranty not found.', 'error'); return; }
                const html = buildWarrantyForm(warr);
                openModal('✎ Edit Warranty', html, 'warranty', id);
            }

            function buildWarrantyForm(data = null) {
                const d = data || {};
                const methods = ['Sq.ft', 'Sq.m', 'Running Ft', 'Kg', 'Litre', 'Nos', 'Lump Sum', 'Percentage'];
                const methodOpts = methods.map(m => `<option value="${m}" ${m === d.pricingMethod ? 'selected':''}>${m}</option>`)
                    .join('');

                const systems = getSystems();
                let sysCheckboxes = '';
                if (systems.length === 0) {
                    sysCheckboxes = '<p style="color:#a0aec0;">No systems defined yet.</p>';
                } else {
                    const selected = d.applicableSystems || [];
                    const allChecked = selected.includes('all') ? 'checked' : '';
                    sysCheckboxes = `
                        <div class="form-check" style="margin-bottom:0.5rem;">
                            <input type="checkbox" id="warApplyAll" ${allChecked} />
                            <label for="warApplyAll"><strong>All Systems</strong></label>
                        </div>
                        <div class="system-checkboxes">
                            ${systems.map(sys => `
                                <label>
                                    <input type="checkbox" class="war-system-check" value="${sys.id}" ${selected.includes(sys.id) ? 'checked' : ''} />
                                    ${escapeHtml(sys.name)}
                                </label>
                            `).join('')}
                        </div>
                    `;
                }

                return `
                    <div class="form-group">
                        <label>Warranty Period (Years) <span class="required">*</span></label>
                        <input type="number" id="warYears" value="${d.years!==undefined ? d.years : ''}" placeholder="e.g. 5" step="1" min="0" required />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pricing Method <span class="required">*</span></label>
                            <select id="warPricingMethod" required>${methodOpts}</select>
                        </div>
                        <div class="form-group">
                            <label>Additional Rate (₹) <span class="required">*</span></label>
                            <input type="number" id="warRate" value="${d.additionalRate!==undefined ? d.additionalRate : ''}" step="0.01" min="0" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Applicable Systems</label>
                        ${sysCheckboxes}
                    </div>
                    <div class="form-group">
                        <label>Warranty Terms</label>
                        <textarea id="warTerms" rows="2" placeholder="e.g. 10 years manufacturer warranty against defects...">${escapeHtml(d.terms||'')}</textarea>
                        <div class="hint">These terms will appear on the customer quotation PDF.</div>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="warActive" ${d.active !== false ? 'checked' : ''} />
                        <label for="warActive">Active</label>
                    </div>
                `;
            }

            function handleWarrantySubmit(e) {
                e.preventDefault();
                const years = parseInt(document.getElementById('warYears').value);
                const method = document.getElementById('warPricingMethod').value;
                const rate = parseFloat(document.getElementById('warRate').value);
                const active = document.getElementById('warActive').checked;
                const terms = document.getElementById('warTerms').value.trim();

                if (isNaN(years) || years < 0) { showToast('Valid Warranty Period is required.', 'warning'); return; }
                if (isNaN(rate) || rate < 0) { showToast('Valid Additional Rate is required.', 'warning'); return; }

                let applicableSystems = [];
                const allCheck = document.getElementById('warApplyAll');
                if (allCheck && allCheck.checked) {
                    applicableSystems = ['all'];
                } else {
                    document.querySelectorAll('.war-system-check:checked').forEach(cb => {
                        applicableSystems.push(parseInt(cb.value));
                    });
                }

                const list = getWarranties();
                // check duplicate years? allow multiple for same year? We'll enforce unique years.
                const dup = list.find(w => w.years === years && w.id !== editId);
                if (dup) { showToast('⚠️ Warranty period ' + years + ' years already exists.', 'error'); return; }

                const warObj = {
                    id: editId || generateId(list),
                    years,
                    pricingMethod: method,
                    additionalRate: rate,
                    applicableSystems,
                    terms,
                    active,
                    updatedAt: new Date().toISOString()
                };

                if (editId) {
                    const idx = list.findIndex(w => w.id === editId);
                    if (idx === -1) { showToast('Warranty not found.', 'error'); return; }
                    list[idx] = { ...list[idx], ...warObj };
                    showToast('✅ Warranty updated.', 'success');
                } else {
                    warObj.createdAt = new Date().toISOString();
                    list.push(warObj);
                    showToast('✅ Warranty added.', 'success');
                }
                saveWarranties(list);
                closeModal();
                renderWarranties();
            }

            // -------------------- FORM SUBMIT DISPATCH --------------------
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if (currentEntityType === 'system') handleSystemSubmit(e);
                else if (currentEntityType === 'option') handleOptionSubmit(e);
                else if (currentEntityType === 'warranty') handleWarrantySubmit(e);
            });

            // -------------------- ADD BUTTONS --------------------
            document.getElementById('addSystemBtn').addEventListener('click', function() {
                const html = buildSystemForm();
                openModal('➕ Add Waterproofing System', html, 'system');
            });
            document.getElementById('addOptionBtn').addEventListener('click', function() {
                const html = buildOptionForm();
                openModal('➕ Add Option', html, 'option');
            });
            document.getElementById('addWarrantyBtn').addEventListener('click', function() {
                const html = buildWarrantyForm();
                openModal('➕ Add Warranty', html, 'warranty');
            });

            // -------------------- TAB SWITCHING --------------------
            const tabBtns = document.querySelectorAll('.tab-btn');
            const panels = {
                systems: document.getElementById('panelSystems'),
                options: document.getElementById('panelOptions'),
                warranties: document.getElementById('panelWarranties')
            };

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    Object.keys(panels).forEach(key => {
                        panels[key].classList.toggle('active', key === tab);
                    });
                    // re-render if needed (search fields already)
                });
            });

            // -------------------- SEARCH --------------------
            document.getElementById('searchSystems').addEventListener('input', renderSystems);
            document.getElementById('searchOptions').addEventListener('input', renderOptions);
            document.getElementById('searchWarranties').addEventListener('input', renderWarranties);

            // -------------------- REFRESH & NAV --------------------
            document.getElementById('refreshBtn').addEventListener('click', function() {
                renderSystems();
                renderOptions();
                renderWarranties();
                showToast('⟳ Refreshed', 'info', 1200);
            });
            document.getElementById('backBtn').addEventListener('click', () => window.location.href = '../../index.html');
