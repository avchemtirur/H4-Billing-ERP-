<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Visual Template Designer</title>
<style>
  :root{
    --panel-bg:#1b1e27;
    --panel-bg-2:#242833;
    --panel-line:#333747;
    --text-hi:#f2f3f7;
    --text-lo:#9aa0b4;
    --accent:#5b8cff;
    --danger:#ff5d5d;
    --radius:12px;
    --stage-bg:#0f1117;
    --sheet-h: 46vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; background:var(--stage-bg); color:var(--text-hi);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{display:flex; flex-direction:column; height:100dvh; height:100vh;}

  /* ---------- TOP SETTINGS BAR ---------- */
  #topbar{
    background:var(--panel-bg); border-bottom:1px solid var(--panel-line);
    padding:10px 12px 8px; flex-shrink:0;
  }
  #topbar .title{font-size:11px; letter-spacing:.14em; color:var(--text-lo); font-weight:700; margin-bottom:8px;}
  .field-row{display:flex; gap:8px; margin-bottom:8px;}
  .field-row:last-child{margin-bottom:0;}
  .field{flex:1; min-width:0;}
  .field label{display:block; font-size:10px; color:var(--text-lo); margin-bottom:3px;}
  .field input, .field select{
    width:100%; background:var(--panel-bg-2); border:1px solid var(--panel-line); color:var(--text-hi);
    border-radius:8px; padding:8px 9px; font-size:13px; font-family:inherit;
  }
  #saveBtn{
    background:var(--accent); border:none; color:#fff; font-weight:700; font-size:13px;
    border-radius:8px; padding:0 16px; white-space:nowrap;
  }

  /* ---------- ELEMENT TOOLBAR ---------- */
  #toolbar{
    display:flex; gap:6px; overflow-x:auto; padding:9px 10px; background:var(--panel-bg-2);
    border-bottom:1px solid var(--panel-line); flex-shrink:0; -webkit-overflow-scrolling:touch;
  }
  #toolbar::-webkit-scrollbar{display:none;}
  .tool-chip{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:var(--panel-bg); border:1px solid var(--panel-line); color:var(--text-hi);
    border-radius:10px; padding:8px 12px; font-size:10px; font-weight:600;
  }
  .tool-chip .ic{font-size:16px;}
  .tool-chip:active{background:var(--accent);}

  /* ---------- CANVAS STAGE ---------- */
  #stageWrap{
    flex:1; min-height:0; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
    padding:24px 16px 100px; -webkit-overflow-scrolling:touch;
  }
  #stageOuter{position:relative; flex-shrink:0;}
  #a4{
    position:relative; width:794px; height:1123px; background:#fff; transform-origin:top left;
    box-shadow:0 10px 40px rgba(0,0,0,.5); overflow:hidden;
  }
  .el{
    position:absolute; cursor:grab; user-select:none; touch-action:none;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .el.locked{cursor:not-allowed;}
  .el[data-hidden="1"]{display:none;}
  .el.selected{outline:2px solid var(--accent);}
  .el .ph-label{font-size:11px; color:#8892a6; letter-spacing:.05em; pointer-events:none;}

  .handle{
    position:absolute; width:22px; height:22px; background:var(--accent); border:2px solid #fff;
    border-radius:50%; z-index:5;
  }
  .handle.nw{top:-11px; left:-11px; cursor:nwse-resize;}
  .handle.ne{top:-11px; right:-11px; cursor:nesw-resize;}
  .handle.sw{bottom:-11px; left:-11px; cursor:nesw-resize;}
  .handle.se{bottom:-11px; right:-11px; cursor:nwse-resize;}
  .handle.rot{
    top:-46px; left:50%; margin-left:-11px; background:#ffb020; cursor:grab;
  }
  .handle.rot::after{
    content:''; position:absolute; top:22px; left:9px; width:2px; height:24px; background:#ffb020;
  }

  /* ---------- ZOOM CONTROLS ---------- */
  #zoomCtl{
    position:fixed; right:14px; bottom:calc(var(--sheet-off, 14px) + 14px); z-index:20;
    background:var(--panel-bg); border:1px solid var(--panel-line); border-radius:24px;
    display:flex; align-items:center; gap:2px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,.4);
    transition:bottom .2s;
  }
  #zoomCtl button{
    width:34px; height:34px; border-radius:50%; border:none; background:var(--panel-bg-2); color:#fff; font-size:16px;
  }
  #zoomPct{font-size:11px; color:var(--text-lo); width:42px; text-align:center;}

  /* ---------- LAYERS FAB ---------- */
  #layersFab{
    position:fixed; left:14px; bottom:calc(var(--sheet-off, 14px) + 14px); z-index:20;
    background:var(--panel-bg); border:1px solid var(--panel-line); color:#fff;
    border-radius:24px; padding:10px 16px; font-size:12px; font-weight:700; display:flex; gap:6px; align-items:center;
    box-shadow:0 4px 16px rgba(0,0,0,.4); transition:bottom .2s;
  }

  /* ---------- BOTTOM SHEETS ---------- */
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--panel-bg); border-top:1px solid var(--panel-line);
    border-radius:16px 16px 0 0; max-height:var(--sheet-h); overflow-y:auto; z-index:30;
    box-shadow:0 -8px 30px rgba(0,0,0,.5); transform:translateY(100%); transition:transform .22s ease;
    padding:12px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet.open{transform:translateY(0);}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .sheet-head h3{margin:0; font-size:14px;}
  .sheet-head .x{background:none; border:none; color:var(--text-lo); font-size:20px; line-height:1; padding:4px 8px;}
  .grab{width:36px; height:4px; background:var(--panel-line); border-radius:2px; margin:0 auto 10px;}

  .prop-section{margin-bottom:14px;}
  .prop-section h4{
    font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-lo); margin:0 0 8px;
  }
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  .prop-field label{display:block; font-size:9px; color:var(--text-lo); margin-bottom:2px;}
  .prop-field input, .prop-field select, .prop-field textarea{
    width:100%; background:var(--panel-bg-2); border:1px solid var(--panel-line); color:var(--text-hi);
    border-radius:7px; padding:6px 7px; font-size:12px; font-family:inherit;
  }
  .prop-field input[type=color]{padding:2px; height:30px;}
  .prop-field textarea{resize:vertical; min-height:56px;}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .btn{
    background:var(--panel-bg-2); border:1px solid var(--panel-line); color:var(--text-hi);
    border-radius:8px; padding:8px 10px; font-size:11px; font-weight:600; flex:1; min-width:70px;
  }
  .btn.danger{color:var(--danger); border-color:#5a2b2b;}
  .btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .toggle-row{display:flex; gap:6px;}
  .toggle-row .opt{flex:1; text-align:center; padding:7px 4px; border-radius:7px; background:var(--panel-bg-2); border:1px solid var(--panel-line); font-size:11px;}
  .toggle-row .opt.sel{background:var(--accent); border-color:var(--accent);}

  #layerList{list-style:none; margin:0; padding:0;}
  #layerList li{
    display:flex; align-items:center; gap:8px; padding:9px 6px; border-bottom:1px solid var(--panel-line);
  }
  #layerList li .lname{flex:1; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #layerList li.active{background:rgba(91,140,255,.12); border-radius:8px;}
  #layerList button{background:none; border:none; color:var(--text-lo); font-size:15px; padding:4px 6px;}
  #layerList button.on{color:var(--accent);}

  /* ---------- SAVE / JSON MODAL ---------- */
  #modalBg{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  #modalBg.open{display:flex;}
  #modalCard{
    background:var(--panel-bg); border:1px solid var(--panel-line); border-radius:14px; padding:16px;
    max-width:100%; width:100%; max-height:80vh; display:flex; flex-direction:column; gap:10px;
  }
  #modalCard h3{margin:0; font-size:14px;}
  #jsonOut{
    flex:1; overflow:auto; background:#0c0e14; border:1px solid var(--panel-line); border-radius:8px;
    padding:10px; font-size:10.5px; line-height:1.4; color:#9be29b; white-space:pre-wrap; word-break:break-word;
  }
  .modal-actions{display:flex; gap:8px;}

  .hint-toast{
    position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#111; color:#fff;
    padding:8px 14px; border-radius:20px; font-size:12px; z-index:60; opacity:0; transition:opacity .25s;
    border:1px solid var(--panel-line);
  }
  .hint-toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- TEMPLATE SETTINGS -->
  <div id="topbar">
    <div class="title">TEMPLATE DESIGNER</div>
    <div class="field-row">
      <div class="field">
        <label>Name</label>
        <input id="tplName" value="Waterproofing Quote">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Type</label>
        <select id="tplType">
          <option value="quotation">Quotation</option>
          <option value="invoice">Invoice</option>
        </select>
      </div>
      <div class="field">
        <label>Theme</label>
        <select id="tplTheme"></select>
      </div>
      <button id="saveBtn">💾 Save</button>
    </div>
  </div>

  <!-- ELEMENT TOOLBAR -->
  <div id="toolbar">
    <div class="tool-chip" data-add="text"><span class="ic">T</span>Text</div>
    <div class="tool-chip" data-add="image"><span class="ic">🖼</span>Image</div>
    <div class="tool-chip" data-add="shape"><span class="ic">◇</span>Shape</div>
    <div class="tool-chip" data-add="logo"><span class="ic">🏷</span>Logo</div>
    <div class="tool-chip" data-add="table"><span class="ic">▦</span>Table</div>
    <div class="tool-chip" data-add="customer"><span class="ic">👤</span>Customer</div>
    <div class="tool-chip" data-add="total"><span class="ic">Σ</span>Total</div>
    <div class="tool-chip" data-add="signature"><span class="ic">✎</span>Signature</div>
    <div class="tool-chip" data-add="footer"><span class="ic">▤</span>Footer</div>
  </div>

  <!-- CANVAS -->
  <div id="stageWrap">
    <div id="stageOuter">
      <div id="a4"></div>
    </div>
  </div>

  <!-- FLOATING CONTROLS -->
  <div id="layersFab">📚 Layers</div>
  <div id="zoomCtl">
    <button id="zoomOut">–</button>
    <div id="zoomPct">45%</div>
    <button id="zoomIn">+</button>
    <button id="zoomFit">⤢</button>
  </div>
</div>

<!-- PROPERTIES SHEET -->
<div class="sheet" id="propSheet">
  <div class="grab"></div>
  <div class="sheet-head">
    <h3 id="propTitle">SELECTED</h3>
    <button class="x" id="propClose">✕</button>
  </div>
  <div id="propBody"></div>
</div>

<!-- LAYERS SHEET -->
<div class="sheet" id="layersSheet">
  <div class="grab"></div>
  <div class="sheet-head">
    <h3>LAYERS</h3>
    <button class="x" id="layersClose">✕</button>
  </div>
  <ul id="layerList"></ul>
</div>

<!-- SAVE / EXPORT MODAL -->
<div id="modalBg">
  <div id="modalCard">
    <h3>Template JSON (h4_templates)</h3>
    <div id="jsonOut"></div>
    <div class="modal-actions">
      <button class="btn" id="copyJson">Copy</button>
      <button class="btn" id="dlJson">Download .json</button>
      <button class="btn active" id="closeModal">Done</button>
    </div>
  </div>
</div>

<div class="hint-toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= THEMES (Theme Manager output — h4_themes) ================= */
const THEMES = {
  h4_red:     {name:'H4 Red Premium',  bg:'#ffffff', accent:'#F44336', accent2:'#FF9800', font:'Poppins, sans-serif', ink:'#241414'},
  blue_corp:  {name:'Blue Corporate',  bg:'#ffffff', accent:'#1E3A8A', accent2:'#2563EB', font:'Inter, sans-serif',   ink:'#12172b'},
  teal_min:   {name:'Teal Minimal',    bg:'#FAFAFA', accent:'#0F766E', accent2:'#14B8A6', font:'Poppins, sans-serif', ink:'#0d1f1d'}
};
let currentThemeId = 'h4_red';

/* ================= STATE ================= */
let elements = [];      // template.elements[]
let zCounter = 1;
let selectedId = null;
let scale = 0.45;
const PAGE_W = 794, PAGE_H = 1123;
let currentTemplateId = null;

const $ = (sel, root) => (root||document).querySelector(sel);
const $all = (sel, root) => Array.from((root||document).querySelectorAll(sel));

/* ================= INIT THEME SELECT ================= */
const themeSel = $('#tplTheme');
Object.entries(THEMES).forEach(([id,t])=>{
  const o = document.createElement('option'); o.value=id; o.textContent=t.name; themeSel.appendChild(o);
});
themeSel.value = currentThemeId;
themeSel.addEventListener('change', ()=>{
  currentThemeId = themeSel.value;
  applyThemeToCanvasBackground();
});

function applyThemeToCanvasBackground(){
  const t = THEMES[currentThemeId];
  $('#a4').style.background = t.bg;
}

/* ================= ELEMENT FACTORY ================= */
function uid(){ return 'el_' + Math.random().toString(36).slice(2,10); }

function defaultsFor(type){
  const t = THEMES[currentThemeId];
  switch(type){
    case 'text':
      return {w:220,h:44,props:{kind:'text', content:'Text', font:t.font.split(',')[0], size:20, weight:'400', align:'left', color:'#222222'}};
    case 'image':
      return {w:220,h:150,props:{kind:'image', src:null, fit:'contain'}};
    case 'logo':
      return {w:120,h:120,props:{kind:'image', src:null, fit:'contain', isLogo:true}};
    case 'shape':
      return {w:220,h:120,props:{kind:'shape', shapeType:'rectangle', fillType:'solid', color:t.accent,
              gradFrom:t.accent, gradTo:t.accent2, gradAngle:45, stroke:0, strokeColor:'#ffffff',
              shadow:false, radius:10}};
    case 'table':
      return {w:700,h:170,props:{kind:'table', columns:['DESCRIPTION','QTY','RATE','AMOUNT'], rows:2}};
    case 'customer':
      return {w:300,h:110,props:{kind:'text', content:'BILL TO:\n{{customer.name}}\n{{customer.address}}\n{{customer.mobile}}\n{{customer.email}}', font:t.font.split(',')[0], size:13, weight:'400', align:'left', color:'#222222'}};
    case 'total':
      return {w:260,h:90,props:{kind:'text', content:'Subtotal: {{subtotal}}\nGST: {{gst}}\nGrand Total: {{grandTotal}}', font:t.font.split(',')[0], size:14, weight:'600', align:'right', color:'#222222'}};
    case 'signature':
      return {w:200,h:70,props:{kind:'text', content:'Signature\n_______________', font:t.font.split(',')[0], size:13, weight:'400', align:'left', color:'#222222'}};
    case 'footer':
      return {w:700,h:40,props:{kind:'text', content:'{{company.name}} • Thank you for your business', font:t.font.split(',')[0], size:11, weight:'400', align:'center', color:'#777777'}};
    default:
      return {w:150,h:80,props:{kind:'text', content:type, font:'Poppins', size:14, weight:'400', align:'left', color:'#222'}};
  }
}

function addElement(type){
  const d = defaultsFor(type);
  const el = {
    id: uid(), type, x: (PAGE_W-d.w)/2, y: 60 + elements.length*10, w:d.w, h:d.h,
    rotation:0, opacity:1, locked:false, hidden:false, z: zCounter++, props: d.props
  };
  elements.push(el);
  render();
  selectElement(el.id);
  toast('Added ' + type);
}

/* ================= RENDER ================= */
const canvas = $('#a4');

function render(){
  canvas.innerHTML = '';
  elements.slice().sort((a,b)=>a.z-b.z).forEach(el=>{
    canvas.appendChild(buildElDom(el));
  });
  layoutStage();
  if(selectedId) highlightSelection();
  renderLayers();
}

function buildElDom(el){
  const wrap = document.createElement('div');
  wrap.className = 'el' + (el.id===selectedId?' selected':'') + (el.locked?' locked':'');
  wrap.dataset.id = el.id;
  wrap.dataset.hidden = el.hidden ? '1':'0';
  wrap.style.left = el.x+'px';
  wrap.style.top = el.y+'px';
  wrap.style.width = el.w+'px';
  wrap.style.height = el.h+'px';
  wrap.style.opacity = el.opacity;
  wrap.style.transform = 'rotate('+el.rotation+'deg)';

  const p = el.props;
  if(p.kind === 'text'){
    const div = document.createElement('div');
    div.style.width='100%'; div.style.height='100%';
    div.style.display='flex'; div.style.alignItems='center';
    div.style.justifyContent = p.align==='center'?'center':(p.align==='right'?'flex-end':'flex-start');
    div.style.textAlign = p.align;
    div.style.fontFamily = p.font;
    div.style.fontSize = p.size+'px';
    div.style.fontWeight = p.weight;
    div.style.color = p.color;
    div.style.whiteSpace = 'pre-wrap';
    div.style.lineHeight = '1.35';
    div.textContent = p.content;
    wrap.appendChild(div);
  } else if(p.kind === 'image'){
    if(p.src){
      const img = document.createElement('img');
      img.src = p.src; img.style.width='100%'; img.style.height='100%'; img.style.objectFit = p.fit;
      wrap.appendChild(img);
    } else {
      const lbl = document.createElement('div');
      lbl.className='ph-label';
      lbl.textContent = p.isLogo ? 'LOGO' : 'IMAGE';
      wrap.style.background = '#eef0f5';
      wrap.style.border = '1px dashed #b8bfd1';
      wrap.appendChild(lbl);
    }
  } else if(p.kind === 'shape'){
    applyShapeStyle(wrap, p);
  } else if(p.kind === 'table'){
    wrap.style.alignItems='stretch'; wrap.style.justifyContent='stretch';
    const t = THEMES[currentThemeId];
    const table = document.createElement('table');
    table.style.width='100%'; table.style.height='100%'; table.style.borderCollapse='collapse';
    table.style.fontFamily = t.font; table.style.fontSize='12px';
    const thead = document.createElement('tr');
    p.columns.forEach(c=>{
      const th = document.createElement('th');
      th.textContent = c; th.style.background = t.accent; th.style.color='#fff';
      th.style.padding='6px 8px'; th.style.textAlign='left'; th.style.fontSize='11px';
      thead.appendChild(th);
    });
    table.appendChild(thead);
    for(let r=0;r<p.rows;r++){
      const tr = document.createElement('tr');
      p.columns.forEach((c,i)=>{
        const td = document.createElement('td');
        td.textContent = i===0 ? 'Item' : (i===p.columns.length-1?'0.00':'-');
        td.style.padding='6px 8px'; td.style.borderBottom='1px solid #e5e7ee'; td.style.fontSize='11px';
        tr.appendChild(td);
      });
      table.appendChild(tr);
    }
    wrap.appendChild(table);
  }

  if(el.id === selectedId && !el.locked){
    ['nw','ne','sw','se'].forEach(pos=>{
      const h = document.createElement('div');
      h.className = 'handle ' + pos;
      h.dataset.handle = pos;
      wrap.appendChild(h);
    });
    const rot = document.createElement('div');
    rot.className = 'handle rot';
    rot.dataset.handle = 'rot';
    wrap.appendChild(rot);
  }

  return wrap;
}

function applyShapeStyle(wrap, p){
  wrap.style.background = p.fillType==='gradient'
    ? `linear-gradient(${p.gradAngle}deg, ${p.gradFrom}, ${p.gradTo})`
    : p.color;
  wrap.style.border = p.stroke>0 ? `${p.stroke}px solid ${p.strokeColor}` : 'none';
  wrap.style.boxShadow = p.shadow ? '0 6px 15px rgba(0,0,0,.25)' : 'none';
  switch(p.shapeType){
    case 'circle': wrap.style.borderRadius='50%'; break;
    case 'ellipse': wrap.style.borderRadius='50%'; break;
    case 'rounded-rect': wrap.style.borderRadius=(p.radius||10)+'px'; break;
    case 'triangle':
      wrap.style.background='transparent'; wrap.style.boxShadow='none'; wrap.style.border='none';
      wrap.style.clipPath = 'none';
      wrap.innerHTML = `<div style="width:0;height:0;border-left:${wrap.style.width ? '' : ''}"></div>`;
      wrap.style.setProperty('--tri','1');
      wrap.style.background = 'transparent';
      wrap.appendChild(Object.assign(document.createElement('div'),{
        style:`width:100%;height:100%;background:${p.fillType==='gradient'?`linear-gradient(${p.gradAngle}deg,${p.gradFrom},${p.gradTo})`:p.color};clip-path:polygon(50% 0%, 0% 100%, 100% 100%);`
      }));
      break;
    case 'diamond': wrap.style.clipPath='polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)'; break;
    case 'wave': wrap.style.borderRadius='0 0 50% 50% / 0 0 30% 30%'; break;
    case 'line': wrap.style.height='4px'; wrap.style.background=p.color; break;
    default: wrap.style.borderRadius='0';
  }
}

function layoutStage(){
  const wrapWidth = document.getElementById('stageWrap').clientWidth - 32;
  canvas.style.transform = `scale(${scale})`;
  const outer = document.getElementById('stageOuter');
  outer.style.width = (PAGE_W*scale)+'px';
  outer.style.height = (PAGE_H*scale)+'px';
  $('#zoomPct').textContent = Math.round(scale*100)+'%';
}

/* ================= SELECTION / DRAG / RESIZE / ROTATE ================= */
let drag = null; // {mode, id, startClientX, startClientY, orig:{x,y,w,h,rotation}}

canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);

function getEl(id){ return elements.find(e=>e.id===id); }

function onPointerDown(e){
  const handle = e.target.closest('.handle');
  const elDom = e.target.closest('.el');
  if(handle && elDom){
    const el = getEl(elDom.dataset.id);
    if(!el || el.locked) return;
    e.preventDefault();
    const mode = handle.dataset.handle === 'rot' ? 'rotate' : 'resize-'+handle.dataset.handle;
    drag = { mode, id:el.id, startClientX:e.clientX, startClientY:e.clientY,
      orig:{x:el.x,y:el.y,w:el.w,h:el.h,rotation:el.rotation}, centerScreen:getCenterScreen(el) };
    (e.target).setPointerCapture && e.target.setPointerCapture(e.pointerId);
    return;
  }
  if(elDom){
    const el = getEl(elDom.dataset.id);
    if(!el) return;
    selectElement(el.id);
    if(el.locked) return;
    e.preventDefault();
    drag = { mode:'move', id:el.id, startClientX:e.clientX, startClientY:e.clientY, orig:{x:el.x,y:el.y} };
    return;
  }
  // clicked empty canvas
  deselect();
}

function getCenterScreen(el){
  const rect = canvas.getBoundingClientRect();
  const cx = rect.left + (el.x + el.w/2)*scale;
  const cy = rect.top + (el.y + el.h/2)*scale;
  return {cx,cy};
}

function onPointerMove(e){
  if(!drag) return;
  const el = getEl(drag.id);
  if(!el) return;
  const dx = (e.clientX - drag.startClientX)/scale;
  const dy = (e.clientY - drag.startClientY)/scale;

  if(drag.mode === 'move'){
    el.x = clamp(drag.orig.x + dx, -el.w+20, PAGE_W-20);
    el.y = clamp(drag.orig.y + dy, -el.h+20, PAGE_H-20);
  } else if(drag.mode === 'rotate'){
    const ang = Math.atan2(e.clientY - drag.centerScreen.cy, e.clientX - drag.centerScreen.cx);
    let deg = ang*180/Math.PI + 90;
    deg = Math.round(deg);
    el.rotation = deg;
  } else if(drag.mode.startsWith('resize-')){
    const corner = drag.mode.split('-')[1];
    let {x,y,w,h} = drag.orig;
    if(corner==='se'){ w = Math.max(24, drag.orig.w + dx); h = Math.max(24, drag.orig.h + dy); }
    if(corner==='sw'){ w = Math.max(24, drag.orig.w - dx); h = Math.max(24, drag.orig.h + dy); x = drag.orig.x + (drag.orig.w - w); }
    if(corner==='ne'){ w = Math.max(24, drag.orig.w + dx); h = Math.max(24, drag.orig.h - dy); y = drag.orig.y + (drag.orig.h - h); }
    if(corner==='nw'){ w = Math.max(24, drag.orig.w - dx); h = Math.max(24, drag.orig.h - dy); x = drag.orig.x + (drag.orig.w - w); y = drag.orig.y + (drag.orig.h - h); }
    el.x=x; el.y=y; el.w=w; el.h=h;
  }
  render();
  if(selectedId===el.id) refreshPropsInPlace(el);
}

function onPointerUp(){ drag = null; }
function clamp(v,min,max){ return Math.min(max, Math.max(min,v)); }

function selectElement(id){
  selectedId = id;
  render();
  openPropSheet();
}
function deselect(){
  selectedId = null;
  render();
  closePropSheet();
}
function highlightSelection(){ /* handled in buildElDom via class */ }

/* ================= PROPERTIES SHEET ================= */
const propSheet = $('#propSheet');
const propBody = $('#propBody');
const propTitle = $('#propTitle');

function openPropSheet(){
  const el = getEl(selectedId);
  if(!el) return;
  propTitle.textContent = 'SELECTED: ' + labelFor(el);
  propBody.innerHTML = buildPropsHtml(el);
  propSheet.classList.add('open');
  document.documentElement.style.setProperty('--sheet-off', 'calc(' + getComputedStyle(propSheet).maxHeight + ' + 8px)');
  bindPropEvents(el);
}
function closePropSheet(){
  propSheet.classList.remove('open');
  document.documentElement.style.setProperty('--sheet-off', '14px');
}
function refreshPropsInPlace(el){
  // update only transform numeric fields to avoid destroying focus while dragging
  const map = {px:el.x, py:el.y, pw:el.w, ph:el.h, protn:el.rotation};
  Object.entries(map).forEach(([id,val])=>{
    const inp = document.getElementById(id);
    if(inp && document.activeElement!==inp) inp.value = Math.round(val);
  });
}

function labelFor(el){
  const names = {text:'Text', image:'Image', shape:'Shape', logo:'Logo', table:'Table',
    customer:'Customer Block', total:'Total Block', signature:'Signature', footer:'Footer'};
  return names[el.type] || el.type;
}

function buildPropsHtml(el){
  const p = el.props;
  let html = `
  <div class="prop-section">
    <h4>Transform</h4>
    <div class="grid4">
      <div class="prop-field"><label>X</label><input type="number" id="px" value="${Math.round(el.x)}"></div>
      <div class="prop-field"><label>Y</label><input type="number" id="py" value="${Math.round(el.y)}"></div>
      <div class="prop-field"><label>Width</label><input type="number" id="pw" value="${Math.round(el.w)}"></div>
      <div class="prop-field"><label>Height</label><input type="number" id="ph" value="${Math.round(el.h)}"></div>
    </div>
    <div class="grid2" style="margin-top:6px;">
      <div class="prop-field"><label>Rotation °</label><input type="number" id="protn" value="${Math.round(el.rotation)}"></div>
      <div class="prop-field"><label>Opacity %</label><input type="number" id="popac" min="0" max="100" value="${Math.round(el.opacity*100)}"></div>
    </div>
  </div>`;

  if(p.kind === 'text'){
    html += `
    <div class="prop-section">
      <h4>Content</h4>
      <div class="prop-field"><textarea id="pcontent">${escapeHtml(p.content)}</textarea></div>
    </div>
    <div class="prop-section">
      <h4>Typography</h4>
      <div class="grid2">
        <div class="prop-field"><label>Font</label>
          <select id="pfont">
            ${['Poppins','Inter','Roboto','Georgia','Arial'].map(f=>`<option ${p.font===f?'selected':''}>${f}</option>`).join('')}
          </select>
        </div>
        <div class="prop-field"><label>Size</label><input type="number" id="psize" value="${p.size}"></div>
      </div>
      <div class="grid2" style="margin-top:6px;">
        <div class="prop-field"><label>Weight</label>
          <select id="pweight">
            ${['300','400','600','700'].map(w=>`<option value="${w}" ${p.weight===w?'selected':''}>${w==='300'?'Light':w==='400'?'Regular':w==='600'?'Semibold':'Bold'}</option>`).join('')}
          </select>
        </div>
        <div class="prop-field"><label>Align</label>
          <select id="palign">
            ${['left','center','right'].map(a=>`<option ${p.align===a?'selected':''}>${a}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="prop-field" style="margin-top:6px;"><label>Color</label><input type="color" id="pcolor" value="${p.color}"></div>
    </div>`;
  }

  if(p.kind === 'image'){
    html += `
    <div class="prop-section">
      <h4>Image</h4>
      <div class="prop-field"><label>Upload</label><input type="file" id="pfile" accept="image/*"></div>
      <div class="prop-field" style="margin-top:6px;"><label>Fit</label>
        <select id="pfit">${['contain','cover','fill'].map(f=>`<option ${p.fit===f?'selected':''}>${f}</option>`).join('')}</select>
      </div>
      <p style="font-size:10px;color:var(--text-lo);margin:8px 0 0;">Crop editor (pinch/pan/apply) arrives in Phase 2 follow-up.</p>
    </div>`;
  }

  if(p.kind === 'shape'){
    html += `
    <div class="prop-section">
      <h4>Shape</h4>
      <div class="prop-field"><label>Type</label>
        <select id="pshape">
          ${['rectangle','rounded-rect','circle','ellipse','triangle','diamond','line','wave'].map(s=>`<option value="${s}" ${p.shapeType===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="toggle-row" style="margin-top:8px;">
        <div class="opt ${p.fillType==='solid'?'sel':''}" data-fill="solid">Solid</div>
        <div class="opt ${p.fillType==='gradient'?'sel':''}" data-fill="gradient">Gradient</div>
      </div>
      <div id="fillFields" style="margin-top:8px;"></div>
    </div>
    <div class="prop-section">
      <h4>Effects</h4>
      <div class="grid2">
        <div class="prop-field"><label>Stroke px</label><input type="number" id="pstroke" value="${p.stroke}"></div>
        <div class="prop-field"><label>Stroke Color</label><input type="color" id="pstrokecolor" value="${p.strokeColor}"></div>
      </div>
      <div class="row-actions" style="margin-top:8px;">
        <button class="btn ${p.shadow?'active':''}" id="pshadow">🌓 Shadow ${p.shadow?'ON':'OFF'}</button>
      </div>
    </div>`;
  }

  if(p.kind === 'table'){
    html += `
    <div class="prop-section">
      <h4>Table</h4>
      <div class="prop-field"><label>Columns (comma separated)</label>
        <input id="pcols" value="${p.columns.join(', ')}">
      </div>
      <div class="prop-field" style="margin-top:6px;"><label>Sample Rows</label>
        <input type="number" id="prows" value="${p.rows}" min="1" max="10">
      </div>
      <p style="font-size:10px;color:var(--text-lo);margin:8px 0 0;">Actual quotation/invoice data replaces sample rows via items[] at render time.</p>
    </div>`;
  }

  html += `
  <div class="prop-section">
    <h4>Layer</h4>
    <div class="row-actions">
      <button class="btn" id="pfront">⬆ Front</button>
      <button class="btn" id="pforward">↑ Forward</button>
      <button class="btn" id="pbackward">↓ Backward</button>
      <button class="btn" id="pback">⬇ Back</button>
    </div>
    <div class="row-actions" style="margin-top:8px;">
      <button class="btn ${el.locked?'active':''}" id="plock">🔒 ${el.locked?'Unlock':'Lock'}</button>
      <button class="btn ${el.hidden?'active':''}" id="phide">👁 ${el.hidden?'Show':'Hide'}</button>
      <button class="btn" id="pdup">📋 Duplicate</button>
      <button class="btn danger" id="pdel">🗑 Delete</button>
    </div>
  </div>`;

  return html;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function bindPropEvents(el){
  const p = el.props;
  const on = (id, ev, fn) => { const n = document.getElementById(id); if(n) n.addEventListener(ev, fn); };

  on('px','input', e=>{ el.x=+e.target.value; render(); });
  on('py','input', e=>{ el.y=+e.target.value; render(); });
  on('pw','input', e=>{ el.w=Math.max(10,+e.target.value); render(); });
  on('ph','input', e=>{ el.h=Math.max(10,+e.target.value); render(); });
  on('protn','input', e=>{ el.rotation=+e.target.value; render(); });
  on('popac','input', e=>{ el.opacity = clamp(+e.target.value,0,100)/100; render(); });

  if(p.kind==='text'){
    on('pcontent','input', e=>{ p.content=e.target.value; render(); });
    on('pfont','change', e=>{ p.font=e.target.value; render(); });
    on('psize','input', e=>{ p.size=+e.target.value; render(); });
    on('pweight','change', e=>{ p.weight=e.target.value; render(); });
    on('palign','change', e=>{ p.align=e.target.value; render(); });
    on('pcolor','input', e=>{ p.color=e.target.value; render(); });
  }

  if(p.kind==='image'){
    on('pfile','change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = ev => { p.src = ev.target.result; render(); };
      reader.readAsDataURL(f);
    });
    on('pfit','change', e=>{ p.fit=e.target.value; render(); });
  }

  if(p.kind==='shape'){
    on('pshape','change', e=>{ p.shapeType=e.target.value; render(); });
    $all('.opt[data-fill]', propBody).forEach(opt=>{
      opt.addEventListener('click', ()=>{ p.fillType=opt.dataset.fill; openPropSheet(); });
    });
    renderFillFields(p);
    on('pstroke','input', e=>{ p.stroke=+e.target.value; render(); });
    on('pstrokecolor','input', e=>{ p.strokeColor=e.target.value; render(); });
    on('pshadow','click', ()=>{ p.shadow=!p.shadow; openPropSheet(); render(); });
  }

  if(p.kind==='table'){
    on('pcols','input', e=>{ p.columns = e.target.value.split(',').map(s=>s.trim()).filter(Boolean); render(); });
    on('prows','input', e=>{ p.rows = Math.max(1,+e.target.value); render(); });
  }

  on('pfront','click', ()=>{ bringToFront(el); });
  on('pforward','click', ()=>{ bringForward(el); });
  on('pbackward','click', ()=>{ sendBackward(el); });
  on('pback','click', ()=>{ sendToBack(el); });
  on('plock','click', ()=>{ el.locked=!el.locked; openPropSheet(); render(); });
  on('phide','click', ()=>{ el.hidden=!el.hidden; openPropSheet(); render(); });
  on('pdup','click', ()=>{ duplicateElement(el); });
  on('pdel','click', ()=>{ deleteElement(el); });
}

function renderFillFields(p){
  const box = $('#fillFields');
  if(!box) return;
  if(p.fillType==='solid'){
    box.innerHTML = `<div class="prop-field"><label>Fill Color</label><input type="color" id="pcolorfill" value="${p.color}"></div>`;
    box.querySelector('#pcolorfill').addEventListener('input', e=>{ p.color=e.target.value; render(); });
  } else {
    box.innerHTML = `
      <div class="grid2">
        <div class="prop-field"><label>Color 1</label><input type="color" id="pgfrom" value="${p.gradFrom}"></div>
        <div class="prop-field"><label>Color 2</label><input type="color" id="pgto" value="${p.gradTo}"></div>
      </div>
      <div class="prop-field" style="margin-top:6px;"><label>Angle °</label><input type="number" id="pgangle" value="${p.gradAngle}"></div>
    `;
    box.querySelector('#pgfrom').addEventListener('input', e=>{ p.gradFrom=e.target.value; render(); });
    box.querySelector('#pgto').addEventListener('input', e=>{ p.gradTo=e.target.value; render(); });
    box.querySelector('#pgangle').addEventListener('input', e=>{ p.gradAngle=+e.target.value; render(); });
  }
}

/* ================= LAYER ORDER OPS ================= */
function bringToFront(el){ el.z = ++zCounter; render(); renderLayers(); }
function sendToBack(el){
  const minZ = Math.min(...elements.map(e=>e.z));
  el.z = minZ - 1; render(); renderLayers();
}
function bringForward(el){
  const above = elements.filter(e=>e.z>el.z).sort((a,b)=>a.z-b.z)[0];
  if(above){ const tmp=el.z; el.z=above.z; above.z=tmp; render(); renderLayers(); }
}
function sendBackward(el){
  const below = elements.filter(e=>e.z<el.z).sort((a,b)=>b.z-a.z)[0];
  if(below){ const tmp=el.z; el.z=below.z; below.z=tmp; render(); renderLayers(); }
}
function duplicateElement(el){
  const copy = JSON.parse(JSON.stringify(el));
  copy.id = uid(); copy.x += 16; copy.y += 16; copy.z = ++zCounter;
  elements.push(copy); selectElement(copy.id); toast('Duplicated');
}
function deleteElement(el){
  elements = elements.filter(e=>e.id!==el.id);
  selectedId = null;
  render(); closePropSheet(); toast('Deleted');
}

/* ================= LAYERS SHEET ================= */
const layersSheet = $('#layersSheet');
function renderLayers(){
  const list = $('#layerList');
  list.innerHTML = '';
  elements.slice().sort((a,b)=>b.z-a.z).forEach(el=>{
    const li = document.createElement('li');
    li.className = el.id===selectedId ? 'active':'';
    li.innerHTML = `
      <span class="lname">${labelFor(el)}</span>
      <button data-act="hide" class="${el.hidden?'on':''}">👁</button>
      <button data-act="lock" class="${el.locked?'on':''}">🔒</button>
      <button data-act="up">↑</button>
      <button data-act="down">↓</button>
      <button data-act="del">🗑</button>
    `;
    li.querySelector('.lname').addEventListener('click', ()=>{ selectElement(el.id); layersSheet.classList.remove('open'); });
    li.querySelector('[data-act=hide]').addEventListener('click', ()=>{ el.hidden=!el.hidden; render(); });
    li.querySelector('[data-act=lock]').addEventListener('click', ()=>{ el.locked=!el.locked; render(); });
    li.querySelector('[data-act=up]').addEventListener('click', ()=>{ bringForward(el); });
    li.querySelector('[data-act=down]').addEventListener('click', ()=>{ sendBackward(el); });
    li.querySelector('[data-act=del]').addEventListener('click', ()=>{ deleteElement(el); });
    list.appendChild(li);
  });
}

/* ================= WIRE UP TOOLBAR / SHEETS / ZOOM ================= */
$all('.tool-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>addElement(chip.dataset.add));
});

$('#propClose').addEventListener('click', deselect);
$('#layersFab').addEventListener('click', ()=>{ renderLayers(); layersSheet.classList.add('open'); });
$('#layersClose').addEventListener('click', ()=>layersSheet.classList.remove('open'));

$('#zoomIn').addEventListener('click', ()=>{ scale=Math.min(1.2, scale+0.1); layoutStage(); });
$('#zoomOut').addEventListener('click', ()=>{ scale=Math.max(0.2, scale-0.1); layoutStage(); });
$('#zoomFit').addEventListener('click', ()=>{ scale=fitScale(); layoutStage(); });

function fitScale(){
  const w = document.getElementById('stageWrap').clientWidth - 32;
  return Math.max(0.2, Math.min(0.9, w/PAGE_W));
}

/* ================= SAVE / EXPORT ================= */
$('#saveBtn').addEventListener('click', saveTemplate);
function saveTemplate(){
  const now = new Date().toISOString();
  currentTemplateId = currentTemplateId || uid();
  const template = {
    templateId: currentTemplateId,
    templateName: $('#tplName').value || 'Untitled Template',
    documentType: $('#tplType').value,
    themeId: currentThemeId,
    active: true,
    isDefault: false,
    elements: elements.map(({id,type,x,y,w,h,rotation,opacity,locked,hidden,z,props})=>
      ({id,type,x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h),
        rotation,opacity,locked,hidden,zIndex:z,props})),
    pageSettings: { width:PAGE_W, height:PAGE_H, unit:'px', orientation:'portrait' },
    createdAt: template_createdAt(),
    updatedAt: now
  };
  persistLocally(template);
  showJsonModal(template);
}
let _createdAtCache = {};
function template_createdAt(){
  if(!_createdAtCache[currentTemplateId]) _createdAtCache[currentTemplateId] = new Date().toISOString();
  return _createdAtCache[currentTemplateId];
}
function persistLocally(template){
  try{
    const store = JSON.parse(localStorage.getItem('h4_templates')||'[]');
    const idx = store.findIndex(t=>t.templateId===template.templateId);
    if(idx>-1) store[idx]=template; else store.push(template);
    localStorage.setItem('h4_templates', JSON.stringify(store));
  }catch(err){ console.warn('local persist failed', err); }
}
function showJsonModal(template){
  $('#jsonOut').textContent = JSON.stringify(template, null, 2);
  $('#modalBg').classList.add('open');
}
$('#closeModal').addEventListener('click', ()=>$('#modalBg').classList.remove('open'));
$('#copyJson').addEventListener('click', ()=>{
  navigator.clipboard?.writeText($('#jsonOut').textContent).then(()=>toast('Copied JSON'));
});
$('#dlJson').addEventListener('click', ()=>{
  const blob = new Blob([$('#jsonOut').textContent], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('#tplName').value || 'template').replace(/\s+/g,'_') + '.json';
  a.click();
});

/* ================= TOAST ================= */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1400);
}

/* ================= SEED SAMPLE LAYOUT (matches the mock-up) ================= */

  elements.push({id:uid(), type:'customer', x:50, y:270, w:cust.w, h:cust.h, rotation:0, opacity:1, locked:false, hidden:false, z:zCounter++, props:cust.props});
  const tbl = defaultsFor('table');

/* ================= BOOT ================= */
applyThemeToCanvasBackground();
seedSample();
scale = fitScale();
render();
window.addEventListener('resize', ()=>{ layoutStage(); });

})();
