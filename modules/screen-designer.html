                const minZ = Math.min(...this.objects.map(o => o.transform.zIndex || 1));
                if ((obj.transform.zIndex || 1) > minZ) {
                    obj.transform.zIndex = (obj.transform.zIndex || 1) - 1;
                    this.pushHistory();
                    this.renderAll();
                }
            },

            // ===== MODULE SIDEBAR =====
            renderModuleSidebar() {
                const container = document.getElementById('moduleList');
                container.innerHTML = '';
                const categories = {};
                Object.values(H4_MODULE_REGISTRY).forEach(m => {
                    if (!categories[m.category]) categories[m.category] = [];
                    categories[m.category].push(m);
                });

                Object.keys(categories).forEach(cat => {
                    const catEl = document.createElement('div');
                    catEl.innerHTML =
                        `<div class="sidebar-title" style="margin-top:8px;">${cat.charAt(0).toUpperCase()+cat.slice(1)}</div>`;
                    container.appendChild(catEl);
                    categories[cat].forEach(m => {
                        const btn = document.createElement('button');
                        btn.className = 'module-btn';
                        btn.innerHTML =
                            `<span class="icon">${m.icon}</span> ${m.title} <span class="badge">${m.id}</span>`;
                        btn.dataset.moduleId = m.id;
                        btn.addEventListener('click', () => {
                            // Add to canvas at a random position
                            const x = 40 + Math.random() * 200;
                            const y = 40 + Math.random() * 200;
                            const obj = H4ObjectEngine.createObject(m.id, x, y);
                            if (obj) {
                                obj.transform.width = 260;
                                obj.transform.height = 150;
                                obj.content.statistic = '0';
                                this.addObject(obj);
                            }
                        });
                        // Drag to canvas
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            // For touch drag, we use a ghost
                            const ghost = document.createElement('div');
                            ghost.style.cssText =
                                'position:fixed;pointer-events:none;z-index:999;padding:8px 16px;background:var(--primary);color:#fff;border-radius:8px;font-weight:600;font-size:0.8rem;';
                            ghost.textContent = `${m.icon} ${m.title}`;
                            document.body.appendChild(ghost);

                            const onMove = (ev) => {
                                ghost.style.left = (ev.clientX - 60) + 'px';
                                ghost.style.top = (ev.clientY - 20) + 'px';
                            };
                            const onUp = (ev) => {
                                ghost.remove();
                                document.removeEventListener('pointermove', onMove);
                                document.removeEventListener('pointerup', onUp);
                                // Check if dropped on canvas
                                const rect = this.canvas.getBoundingClientRect();
                                const sx = this.canvas.offsetWidth / rect.width;
                                const sy = this.canvas.offsetHeight / rect.height;
                                const cx = (ev.clientX - rect.left) * sx;
                                const cy = (ev.clientY - rect.top) * sy;
                                if (cx > 0 && cy > 0 && cx < this.canvas.offsetWidth && cy < this.canvas
                                    .offsetHeight) {
                                    const obj = H4ObjectEngine.createObject(m.id, cx - 130, cy - 75);
                                    if (obj) {
                                        obj.transform.width = 260;
                                        obj.transform.height = 150;
                                        obj.content.statistic = '0';
                                        this.addObject(obj);
                                    }
                                }
                            };
                            document.addEventListener('pointermove', onMove);
                            document.addEventListener('pointerup', onUp);
                        });
                        container.appendChild(btn);
                    });
                });
            },

            // ===== PANEL =====
            updatePanel() {
                const container = this.panelContent;
                const obj = this.getSelectedObject();
                if (!obj) {
                    container.innerHTML = `
                <div class="no-selection">
                  <div class="icon">👆</div>
                  <p>Select an object on the canvas to edit its properties.</p>
                  <p class="text-sm text-muted" style="margin-top:8px;">Click a module card to select it.</p>
                </div>
              `;
                    return;
                }

                // Build properties panel
                const t = obj.transform;
                const s = obj.style || {};
                const c = obj.content || {};

                let html = `
              <div class="panel-section">
                <div class="section-title">📌 Object</div>
                <div class="row-2">
                  <div><label>ID</label><input value="${obj.id}" readonly style="background:#f5f3f8;font-size:0.7rem;"></div>
                  <div><label>Module</label><input value="${obj.moduleId}" readonly style="background:#f5f3f8;font-size:0.7rem;"></div>
                </div>
                <div class="flex gap-8 mt-8">
                  <button class="btn btn-sm btn-outline" onclick="Designer.lockSelected()">${obj.locked?'🔓 Unlock':'🔒 Lock'}</button>

                  <button class="btn btn-sm btn-danger" onclick="Designer.deleteSelected()">🗑️</button>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">📐 Position</div>
                <div class="row-2">
                  <div><label>X</label><input type="number" value="${Math.round(t.x)}" onchange="Designer.updateObjectProp('transform.x', parseFloat(this.value)||0)"></div>
                  <div><label>Y</label><input type="number" value="${Math.round(t.y)}" onchange="Designer.updateObjectProp('transform.y', parseFloat(this.value)||0)"></div>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">📏 Size</div>
                <div class="row-2">
                  <div><label>Width</label><input type="number" value="${Math.round(t.width)}" onchange="Designer.updateObjectProp('transform.width', Math.max(80, parseFloat(this.value)||80))"></div>
                  <div><label>Height</label><input type="number" value="${Math.round(t.height)}" onchange="Designer.updateObjectProp('transform.height', Math.max(60, parseFloat(this.value)||60))"></div>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">🔄 Rotation</div>
                <div><label>Degrees</label><input type="number" value="${Math.round(t.rotation||0)}" onchange="Designer.updateObjectProp('transform.rotation', parseFloat(this.value)||0)"></div>
              </div>

              <div class="panel-section">
                <div class="section-title">🎨 Style</div>
                <div><label>Shape</label>
                  <select onchange="Designer.updateObjectProp('style.shape', this.value)">
                    <option value="square" ${s.shape==='square'?'selected':''}>Square</option>
                    <option value="rounded" ${s.shape==='rounded'?'selected':''}>Rounded</option>
                    <option value="circle" ${s.shape==='circle'?'selected':''}>Circle</option>
                    <option value="pill" ${s.shape==='pill'?'selected':''}>Pill</option>
                  </select>
                </div>
                <div><label>Border Radius</label>
                  <input type="number" value="${s.borderRadius||16}" onchange="Designer.updateObjectProp('style.borderRadius', parseFloat(this.value)||0)">
                </div>
                <div><label>Background Color</label>
                  <input type="color" value="${s.background?.color||'#ffffff'}" onchange="Designer.updateObjectProp('style.background.color', this.value)">
                </div>
                <div><label>Border</label>
                  <div class="row-2">
                    <select onchange="Designer.updateObjectProp('style.border.style', this.value)">
                      <option value="none" ${s.border?.style==='none'?'selected':''}>None</option>
                      <option value="solid" ${s.border?.style==='solid'?'selected':''}>Solid</option>
                      <option value="dashed" ${s.border?.style==='dashed'?'selected':''}>Dashed</option>
                      <option value="dotted" ${s.border?.style==='dotted'?'selected':''}>Dotted</option>
                    </select>
                    <input type="color" value="${s.border?.color||'#e2dce8'}" onchange="Designer.updateObjectProp('style.border.color', this.value)">
                  </div>
                </div>
                <div><label>Shadow</label>
                  <select onchange="Designer.updateObjectProp('style.shadow.preset', this.value)">
                    <option value="none" ${s.shadow?.preset==='none'?'selected':''}>None</option>
                    <option value="small" ${s.shadow?.preset==='small'?'selected':''}>Small</option>
                    <option value="medium" ${s.shadow?.preset==='medium'?'selected':''}>Medium</option>
                    <option value="large" ${s.shadow?.preset==='large'?'selected':''}>Large</option>
                  </select>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">📝 Content</div>
                <div><label>Title</label><input value="${c.title||''}" onchange="Designer.updateObjectProp('content.title', this.value)"></div>
                <div><label>Subtitle</label><input value="${c.subtitle||''}" onchange="Designer.updateObjectProp('content.subtitle', this.value)"></div>
                <div><label>Icon</label><input value="${c.icon||'📦'}" onchange="Designer.updateObjectProp('content.icon', this.value)"></div>
                <div><label>Statistic</label><input value="${c.statistic||'0'}" onchange="Designer.updateObjectProp('content.statistic', this.value)"></div>
                <div><label>Button Text</label><input value="${c.buttonText||'Open'}" onchange="Designer.updateObjectProp('content.buttonText', this.value)"></div>
                <div class="row-2 mt-8">
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.75rem;">
                    <input type="checkbox" ${c.showIcon!==false?'checked':''} onchange="Designer.updateObjectProp('content.showIcon', this.checked)"> Icon
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.75rem;">
                    <input type="checkbox" ${c.showTitle!==false?'checked':''} onchange="Designer.updateObjectProp('content.showTitle', this.checked)"> Title
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.75rem;">
                    <input type="checkbox" ${c.showSubtitle!==false?'checked':''} onchange="Designer.updateObjectProp('content.showSubtitle', this.checked)"> Subtitle
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.75rem;">
                    <input type="checkbox" ${c.showStatistic!==false?'checked':''} onchange="Designer.updateObjectProp('content.showStatistic', this.checked)"> Statistic
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.75rem;">
                    <input type="checkbox" ${c.showButton!==false?'checked':''} onchange="Designer.updateObjectProp('content.showButton', this.checked)"> Button
                  </label>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">👁️ Visibility</div>
                <div class="row-3">
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.7rem;">
                    <input type="checkbox" ${obj.visibility?.desktop!==false?'checked':''} onchange="Designer.updateObjectProp('visibility.desktop', this.checked)"> Desktop
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.7rem;">
                    <input type="checkbox" ${obj.visibility?.tablet!==false?'checked':''} onchange="Designer.updateObjectProp('visibility.tablet', this.checked)"> Tablet
                  </label>
                  <label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:0.7rem;">
                    <input type="checkbox" ${obj.visibility?.mobile!==false?'checked':''} onchange="Designer.updateObjectProp('visibility.mobile', this.checked)"> Mobile
                  </label>
                </div>
              </div>

              <div class="panel-section">
                <div class="section-title">🔗 Action</div>
                <div><label>Module Path</label><input value="${obj.modulePath||''}" readonly style="background:#f5f3f8;font-size:0.7rem;"></div>
                <button class="btn btn-sm btn-outline btn-block mt-8" onclick="toast('🔗 Navigate to ${obj.modulePath||'#'}')">Go to Module</button>
              </div>
            `;

                container.innerHTML = html;
            },

            updateObjectProp(path, value) {
                const obj = this.getSelectedObject();
                if (!obj) return;
                const parts = path.split('.');
                let target = obj;
                for (let i = 0; i < parts.length - 1; i++) {
                    if (!target[parts[i]]) target[parts[i]] = {};
                    target = target[parts[i]];
                }
                target[parts[parts.length - 1]] = value;
                this._dirty = true;
                this.pushHistory();
                this.renderAll();
                this.updatePanel();
            },

            // ===== DEVICE =====
            setDevice(device) {
                this.device = device;
                const container = this.canvas;
                container.className = `canvas-container ${device}`;
                document.querySelectorAll('#deviceSwitcher .btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.device === device);
                });
                // Update visibility based on device
                this.objects.forEach(obj => {
                    const vis = obj.visibility || { desktop: true, tablet: true, mobile: true };
                    const visible = vis[device] !== false;
                    // We re-render to show/hide
                });
                this.renderAll();
                toast(`📱 Switched to ${device}`);
            },

            // ===== GRID =====
            toggleGrid() {
                this.gridVisible = !this.gridVisible;
                this.updateGrid();
                toast(this.gridVisible ? 'Grid shown' : 'Grid hidden');
            },

            toggleSnap() {
                this.snapEnabled = !this.snapEnabled;
                toast(this.snapEnabled ? 'Snap enabled' : 'Snap disabled');
            },

            // ===== EXPORT / IMPORT =====
            exportLayout() {
                const data = {
                    version: 1,
                    screen: 'dashboard',
                    objects: this.objects,
                    theme: H4ThemeEngine.current,
                    exportedAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `h4-layout-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                toast('📤 Layout exported');
            },

            importLayout(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.objects && Array.isArray(data.objects)) {
                            if (confirm('Import will replace current layout. Continue?')) {
                                this.objects = data.objects;
                                if (data.theme) {
                                    H4ThemeEngine.current = { ...H4ThemeEngine.current, ...data.theme };
                                    H4ThemeEngine.save();
                                    H4ThemeEngine.applyToUI();
                                }
                                this.pushHistory();
                                this.renderAll();
                                this.updatePanel();
                                toast('📥 Layout imported successfully!');
                            }
                        } else {
                            toast('Invalid layout file.', 'error');
                        }
                    } catch (err) {
                        toast('Error parsing file.', 'error');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            }
        };

        // ============================================================
        // 7. GLOBAL FUNCTIONS (for inline onclick)
        // ============================================================
        function toggleSidebar() {
            document.getElementById('appSidebar').classList.toggle('open');
        }

        function togglePanel() {
            document.getElementById('appPanel').classList.toggle('open');
        }

        function setDevice(device) {
            Designer.setDevice(device);
        }

        function undoHistory() {
            Designer.undoHistory();
        }

        function redoHistory() {
            Designer.redoHistory();
        }

        function saveLayout() {
            Designer.saveLayout();
        }

        function exportLayout() {
            Designer.exportLayout();
        }

        function importLayout(event) {
            Designer.importLayout(event);
        }

        function addModuleToCanvas() {
            const modules = Object.keys(H4_MODULE_REGISTRY);
            const randomModule = modules[Math.floor(Math.random() * modules.length)];
            const x = 40 + Math.random() * 200;
            const y = 40 + Math.random() * 200;
            const obj = H4ObjectEngine.createObject(randomModule, x, y);
            if (obj) {
                obj.transform.width = 260;
                obj.transform.height = 150;
                obj.content.statistic = Math.floor(Math.random() * 50 + 1).toString();
                Designer.addObject(obj);
            }
        }

        function toast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', warning: '⚠️' };
            el.innerHTML = `
            <span>${icons[type] || 'ℹ️'}</span>
            <span style="flex:1;">${msg}</span>
            <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
          `;
            container.appendChild(el);
            setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
        }

        // ============================================================
        // 8. INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            Designer.init();

            // Close sidebar/panel on outside click (mobile)
            document.addEventListener('click', (e) => {
                const sidebar = document.getElementById('appSidebar');
                const panel = document.getElementById('appPanel');
                if (window.innerWidth <= 1024) {
                    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !e.target.closest(
                            '.header-actions')) {
                        sidebar.classList.remove('open');
                    }
                    if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest(
                            '.header-actions')) {
                        panel.classList.remove('open');
                    }
                }
            });

            // Close bottom sheet on backdrop click
            document.getElementById('bottomSheetOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeBottomSheet();
            });
        });

        function closeBottomSheet() {
            document.getElementById('bottomSheetOverlay').classList.remove('open');
        }

        // ============================================================
        // 9. EXPOSE FOR CONSOLE DEBUG
        // ============================================================
        window.Designer = Designer;
        window.H4_MODULE_REGISTRY = H4_MODULE_REGISTRY;
        window.H4ThemeEngine = H4ThemeEngine;
        window.H4Storage = H4Storage;
        window.H4ObjectEngine = H4ObjectEngine;
        window.H4StyleUtil = H4StyleUtil;

        console.log('🎨 H4 Screen Designer loaded.');
        console.log(`📦 ${Object.keys(H4_MODULE_REGISTRY).length} modules available.`);
        console.log(`📐 ${Designer.objects.length} objects on canvas.`);
        console.log('💡 Click a module card to select and edit properties.');
    </script>

</body>
</html>
