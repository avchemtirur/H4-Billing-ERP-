<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H4 Billing ERP – General Invoice</title>
    <style>
        /* ========================================================
                   GLOBAL STYLES & RESET
                   ======================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
            padding: 20px;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ---- top bar ---- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #0f2b4d;
        }
        .app-header .badge {
            background: #2563eb;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        /* ---- tabs / wizard ---- */
        .wizard-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: white;
            padding: 10px 18px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
        }
        .wizard-tabs button {
            padding: 8px 18px;
            border: none;
            background: transparent;
            border-radius: 30px;
            font-weight: 500;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
        }
        .wizard-tabs button.active {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 8px rgba(37,99,235,0.2);
        }
        .wizard-tabs button:hover:not(.active) {
            background: #e9edf2;
        }

        /* ---- step panels ---- */
        .step-panel {
            background: white;
            padding: 28px 32px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.05);
            display: none;
        }
        .step-panel.active {
            display: block;
        }

        /* ---- form elements ---- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-weight: 500;
            font-size: 13px;
            color: #334155;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 8px 12px;
            border: 1px solid #d1d9e6;
            border-radius: 8px;
            font-size: 14px;
            background: #fafcfd;
            transition: 0.15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
        }

        /* ---- buttons ---- */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #e9edf2;
            color: #1e293b;
        }
        .btn-secondary:hover {
            background: #d1d9e6;
        }
        .btn-success {
            background: #16a34a;
            color: white;
        }
        .btn-success:hover {
            background: #15803d;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            color: #1e293b;
        }
        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        /* ---- items table ---- */
        .item-table-wrap {
            overflow-x: auto;
            margin: 16px 0;
        }
        .item-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .item-table th {
            background: #f1f5f9;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: #1e293b;
        }
        .item-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e9edf2;
            vertical-align: middle;
        }
        .item-table .qty-input {
            width: 70px;
            padding: 6px 8px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            text-align: center;
        }
        .item-table .rate-input {
            width: 90px;
            padding: 6px 8px;
            border: 1px solid #d1d9e6;
            border-radius: 6px;
            text-align: right;
        }
        .item-table .amount-cell {
            font-weight: 500;
            text-align: right;
        }
        .item-table .action-cell {
            text-align: center;
        }

        /* ---- totals ---- */
        .totals-box {
            max-width: 340px;
            margin-left: auto;
            margin-top: 16px;
            background: #f8fafc;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid #e9edf2;
        }
        .totals-box .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .totals-box .row.total {
            font-weight: 700;
            font-size: 18px;
            border-top: 2px solid #d1d9e6;
            padding-top: 8px;
            margin-top: 6px;
        }
        .totals-box .row .label {
            color: #475569;
        }
        .totals-box .row .value {
            font-weight: 500;
        }

        /* ---- preview (A4) ---- */
        .preview-container {
            background: #e9edf2;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            border-radius: 12px;
            margin-top: 20px;
        }
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 12mm 14mm;
            border-radius: 4px;
            font-size: 12pt;
            line-height: 1.5;
            color: #1e293b;
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* ---- invoice preview internal styles (template dependent) ---- */
        .a4-paper .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 10px;
            margin-bottom: 14px;
        }
        .a4-paper .company-info {
            display: flex;
            gap: 14px;
        }
        .a4-paper .company-logo {
            max-height: 60px;
            object-fit: contain;
        }
        .a4-paper .company-text h2 {
            font-size: 20pt;
            font-weight: 700;
            margin: 0;
        }
        .a4-paper .company-text .sub {
            font-size: 10pt;
            color: #475569;
        }
        .a4-paper .doc-title {
            text-align: right;
        }
        .a4-paper .doc-title h3 {
            font-size: 18pt;
            font-weight: 700;
            margin: 0;
            color: #1e293b;
        }
        .a4-paper .doc-title .meta {
            font-size: 10pt;
            color: #475569;
        }

        .a4-paper .bill-to {
            margin: 16px 0 20px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 11pt;
        }
        .a4-paper .bill-to strong {
            display: block;
            margin-bottom: 4px;
        }

        .a4-paper table.items {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 11pt;
        }
        .a4-paper table.items th {
            background: #f1f5f9;
            padding: 8px 6px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #cbd5e1;
        }
        .a4-paper table.items td {
            padding: 6px;
            border-bottom: 1px solid #e9edf2;
        }
        .a4-paper table.items .amount {
            text-align: right;
        }

        .a4-paper .totals {
            margin-top: 12px;
            text-align: right;
            font-size: 11pt;
        }
        .a4-paper .totals .row {
            display: flex;
            justify-content: flex-end;
            gap: 30px;
            padding: 2px 0;
        }
        .a4-paper .totals .row .label {
            font-weight: 400;
        }
        .a4-paper .totals .row .value {
            font-weight: 500;
            min-width: 80px;
            text-align: right;
        }
        .a4-paper .totals .grand-total {
            font-weight: 700;
            font-size: 14pt;
            border-top: 2px solid #1e293b;
            padding-top: 6px;
            margin-top: 6px;
        }

        .a4-paper .amount-words {
            font-size: 11pt;
            font-weight: 500;
            margin: 12px 0 8px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 10px;
        }

        .a4-paper .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid #cbd5e1;
            padding-top: 14px;
            font-size: 10pt;
            color: #475569;
        }
        .a4-paper .footer .signature {
            text-align: right;
        }
        .a4-paper .footer .signature img {
            max-height: 40px;
            margin-top: 4px;
        }

        /* ---- template variants ---- */
        .template-modern .invoice-header {
            border-bottom-color: #2563eb;
        }
        .template-modern .doc-title h3 {
            color: #2563eb;
        }
        .template-modern table.items th {
            background: #2563eb;
            color: white;
        }

        .template-h4 .invoice-header {
            border-bottom-color: #d97706;
        }
        .template-h4 .doc-title h3 {
            color: #d97706;
        }
        .template-h4 table.items th {
            background: #d97706;
            color: white;
        }

        .template-simple .invoice-header {
            border-bottom: 1px solid #cbd5e1;
        }
        .template-simple table.items th {
            background: #f1f5f9;
            border-bottom: 1px solid #cbd5e1;
        }
        .template-simple .a4-paper {
            font-family: 'Times New Roman', serif;
        }

        /* ---- responsive ---- */
        @media (max-width: 768px) {
            .step-panel {
                padding: 18px 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .wizard-tabs button {
                font-size: 13px;
                padding: 6px 14px;
            }
            .a4-paper {
                width: 100%;
                min-height: auto;
                padding: 8mm 6mm;
            }
            .totals-box {
                max-width: 100%;
            }
            .preview-container {
                padding: 10px 0;
            }
            .app-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }

        /* ---- print styles ---- */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .app-header, .wizard-tabs, .step-panel .btn-group,
            .step-panel .form-group input, .step-panel .form-group select,
            .step-panel .form-group textarea, .item-table-wrap .btn,
            .preview-container .btn-group, .no-print {
                display: none !important;
            }
            .preview-container {
                background: white;
                padding: 0;
                border-radius: 0;
            }
            .a4-paper {
                box-shadow: none;
                border: none;
                border-radius: 0;
                width: 100%;
                min-height: auto;
                padding: 10mm 12mm;
            }
            .step-panel {
                box-shadow: none;
                padding: 0;
            }
            .step-panel.active {
                display: block !important;
            }
            .item-table td, .item-table th {
                border-color: #ccc !important;
            }
        }

        /* helper */
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .flex { display: flex; }
        .flex-wrap { flex-wrap: wrap; }
        .gap-8 { gap: 8px; }
        .items-center { align-items: center; }
        .text-muted { color: #64748b; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <!-- Header -->
    <header class="app-header">
        <h1>📄 General Invoice</h1>
        <div class="flex items-center gap-8">
            <span class="badge" id="invoiceStatusBadge">Draft</span>
            <button class="btn btn-secondary btn-sm" onclick="H4Invoice.loadInvoiceList()">📋 Invoices</button>
        </div>
    </header>

    <!-- Wizard Tabs -->
    <div class="wizard-tabs" id="wizardTabs">
        <button class="active" data-step="1">1. Details</button>
        <button data-step="2">2. Customer</button>
        <button data-step="3">3. Items</button>
        <button data-step="4">4. Calculation</button>
        <button data-step="5">5. Payment</button>
        <button data-step="6">6. Notes</button>
        <button data-step="7">7. Preview</button>
    </div>

    <!-- ============================================================
    STEP 1 – INVOICE DETAILS
    ============================================================ -->
    <div class="step-panel active" data-step="1">
        <h3 style="margin-bottom:16px;">Invoice Details</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Invoice Number *</label>
                <input type="text" id="invNumber" placeholder="INV-2026-001" required>
            </div>
            <div class="form-group">
                <label>Invoice Date</label>
                <input type="date" id="invDate">
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="invDueDate">
            </div>
            <div class="form-group">
                <label>Reference</label>
                <input type="text" id="invRef" placeholder="PO / Project ref">
            </div>
            <div class="form-group">
                <label>Project Name</label>
                <input type="text" id="invProject" placeholder="e.g., Tower A">
            </div>
            <div class="form-group" style="grid-column: span 1;">
                <label>Template</label>
                <select id="invTemplate">
                    <option value="classic">Classic</option>
                    <option value="modern" selected>Modern</option>
                    <option value="h4">H4 Premium</option>
                    <option value="simple">Simple</option>
                </select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="H4Invoice.goStep(2)">Next →</button>
        </div>
    </div>

    <!-- ============================================================
    STEP 2 – CUSTOMER
    ============================================================ -->
    <div class="step-panel" data-step="2">
        <h3 style="margin-bottom:16px;">Customer Information</h3>
        <div class="form-grid">
            <div class="form-group" style="grid-column: span 2;">
                <label>Select Customer</label>
                <select id="customerSelect">
                    <option value="">-- Select Customer --</option>
                </select>
                <div style="margin-top:8px;">
                    <button class="btn btn-secondary btn-sm" onclick="H4Invoice.showNewCustomerModal()">➕ New Customer</button>
                </div>
            </div>
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="custName" placeholder="Full name">
            </div>
            <div class="form-group">
                <label>Company</label>
                <input type="text" id="custCompany" placeholder="Company name">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="custPhone" placeholder="Phone">
            </div>
            <div class="form-group">
                <label>WhatsApp</label>
                <input type="text" id="custWhatsApp" placeholder="WhatsApp">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="custEmail" placeholder="Email">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Address</label>
                <input type="text" id="custAddress" placeholder="Street address">
            </div>
            <div class="form-group">
                <label>Landmark</label>
                <input type="text" id="custLandmark" placeholder="Landmark">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="custPincode" placeholder="Pincode">
            </div>
            <div class="form-group">
                <label>GSTIN</label>
                <input type="text" id="custGstin" placeholder="GSTIN (if any)">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="H4Invoice.goStep(1)">← Back</button>
            <button class="btn btn-primary" onclick="H4Invoice.goStep(3)">Next →</button>
        </div>
    </div>

    <!-- ============================================================
    STEP 3 – ITEMS
    ============================================================ -->
    <div class="step-panel" data-step="3">
        <h3 style="margin-bottom:16px;">Invoice Items</h3>
        <div class="form-row mb-8">
            <button class="btn btn-secondary btn-sm" onclick="H4Invoice.addItemRow()">➕ Add Item</button>
            <span class="text-muted" style="font-size:13px;">Select product from dropdown to auto-fill</span>
        </div>
        <div class="item-table-wrap">
            <table class="item-table" id="itemsTable">
                <thead>
                    <tr>
                        <th style="width:30px;">#</th>
                        <th>Product / Description</th>
                        <th style="width:80px;">Qty</th>
                        <th style="width:80px;">Unit</th>
                        <th style="width:100px;">Rate</th>
                        <th style="width:90px;">Disc %</th>
                        <th style="width:80px;">GST %</th>
                        <th style="width:110px;">Amount</th>
                        <th style="width:40px;"></th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    <!-- rows inserted by JS -->
                </tbody>
            </table>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="H4Invoice.goStep(2)">← Back</button>
            <button class="btn btn-primary" onclick="H4Invoice.goStep(4)">Next →</button>
        </div>
    </div>

    <!-- ============================================================
    STEP 4 – CALCULATION
    ============================================================ -->
    <div class="step-panel" data-step="4">
        <h3 style="margin-bottom:16px;">Calculation & Totals</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Subtotal</label>
                <input type="number" id="calcSubtotal" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>Discount (₹)</label>
                <input type="number" id="calcDiscount" step="0.01" min="0" value="0">
            </div>
            <div class="form-group">
                <label>Taxable Amount</label>
                <input type="number" id="calcTaxable" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>CGST (%)</label>
                <input type="number" id="calcCgst" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>SGST (%)</label>
                <input type="number" id="calcSgst" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>IGST (%)</label>
                <input type="number" id="calcIgst" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>Round Off</label>
                <input type="number" id="calcRoundOff" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label>Grand Total</label>
                <input type="number" id="calcGrandTotal" step="0.01" readonly style="background:#f1f5f9;font-weight:700;">
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Amount in Words</label>
                <input type="text" id="calcAmountWords" readonly style="background:#f1f5f9;">
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="H4Invoice.goStep(3)">← Back</button>
            <button class="btn btn-primary" onclick="H4Invoice.goStep(5)">Next →</button>
        </div>
    </div>

    <!-- ============================================================
    STEP 5 – PAYMENT
    ============================================================ -->
    <div class="step-panel" data-step="5">
        <h3 style="margin-bottom:16px;">Payment Information</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Paid Amount</label>
                <input type="number" id="payPaid" step="0.01" value="0">
            </div>
            <div class="form-group">
                <label>Balance Amount</label>
                <input type="number" id="payBalance" step="0.01" readonly style="background:#f1f5f9;">
            </div>
            <div class="form-group">
                <label>Payment Status</label>
                <select id="payStatus">
                    <option value="Draft">Draft</option>
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partially Paid">Partially Paid</option>
                    <option value="Paid">Paid</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="H4Invoice.goStep(4)">← Back</button>
            <button class="btn btn-primary" onclick="H4Invoice.goStep(6)">Next →</button>
        </div>
    </div>

    <!-- ============================================================
    STEP 6 – NOTES / TERMS
    ============================================================ -->
    <div class="step-panel" data-step="6">
        <h3 style="margin-bottom:16px;">Notes & Terms</h3>
        <div class="form-grid">
            <div class="form-group" style="grid-column: span 2;">
                <label>Terms & Conditions</label>
                <textarea id="notesTerms" rows="3">Payment due within 15 days. Late payment interest @18% p.a.</textarea>
            </div>
            <div class="form-group" style="grid-column: span 2;">
                <label>Bank Details</label>
                <textarea id="notesBank" rows="3">Bank: HDFC Bank\nA/C: 1234567890\nIFSC: HDFC0001234</textarea>
            </div>

<!-- ================================================================
JAVASCRIPT – H4 INVOICE MODULE
================================================================ -->
<script>
    (function() {
        'use strict';

        // ============================================================
        // H4Invoice – Main Module
        // ============================================================
        const H4Invoice = {
            // ---- state ----
            currentStep: 1,
            invoiceItems: [],   // array of item objects
            editingInvoiceId: null, // if editing existing invoice

            // ---- DB references ----
            db: null,
            DB_NAME: 'H4BillingERP',
            DB_VERSION: 1,

            // ---- init ----
            init: function() {
                this.openDB().then(() => {
                    this.loadCompanyProfile();
                    this.loadCustomers();
                    this.loadProducts();
                    this.setDefaultDates();
                    this.addItemRow(); // start with one empty row
                    this.attachEvents();
                    this.goStep(1);
                }).catch(err => {
                    console.error('DB init error:', err);
                    alert('Failed to initialize database. Please check console.');
                });
            },

            // ---- IndexedDB ----
            openDB: function() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
                    req.onupgradeneeded = (ev) => {
                        const db = ev.target.result;
                        // Create stores if they don't exist (safe migration)
                        if (!db.objectStoreNames.contains('company')) {
                            db.createObjectStore('company', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('customers')) {
                            const store = db.createObjectStore('customers', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('name', 'name', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('products')) {
                            const store = db.createObjectStore('products', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('name', 'name', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('invoices')) {
                            const store = db.createObjectStore('invoices', { keyPath: 'id', autoIncrement: true });
                            store.createIndex('number', 'number', { unique: false });
                            store.createIndex('date', 'date', { unique: false });
                        }
                        if (!db.objectStoreNames.contains('templates')) {
                            db.createObjectStore('templates', { keyPath: 'id' });
                        }
                    };
                    req.onsuccess = (ev) => {
                        this.db = ev.target.result;
                        resolve();
                    };
                    req.onerror = (ev) => reject(ev.target.error);
                });
            },

            // ---- generic DB helpers ----
            _getAll: function(storeName) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readonly');
                    const store = tx.objectStore(storeName);
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            _put: function(storeName, data) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.put(data);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            _delete: function(storeName, id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction(storeName, 'readwrite');
                    const store = tx.objectStore(storeName);
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(req.error);
                });
            },

            // ============================================================
            // COMPANY PROFILE
            // ============================================================
            loadCompanyProfile: function() {
                this._getAll('company').then(data => {
                    if (data.length === 0) {
                        // seed default company
                        const defaultCompany = {
                            id: 1,
                            legalName: 'H4 Construction Solutions',
                            brandName: 'H4',
                            address: '123, Main Road',
                            landmark: 'Near City Center',
                            city: 'Mumbai',
                            district: 'Mumbai City',
                            state: 'Maharashtra',
                            pincode: '400001',
                            phone: '+91 98765 43210',
                            whatsapp: '+91 98765 43210',
                            email: 'info@h4constructions.in',
                            website: 'www.h4constructions.in',
                            gstin: '27AABCH1234D1Z1',
                            bankDetails: 'Bank: HDFC\nA/C: 1234567890\nIFSC: HDFC0001234',
                            authorizedSignatory: 'Mr. H. Contractor',
                            signature: '', // base64 or URL
                            logo: '',
                            showLogo: true,
                            showSignature: true
                        };
                        this._put('company', defaultCompany);
                        this.company = defaultCompany;
                    } else {
                        this.company = data[0];
                    }
                    this.applyCompanyToUI();
                }).catch(err => console.warn('Company load error:', err));
            },

            applyCompanyToUI: function() {
                // We'll use company data in preview; also we could prefill a company settings form if needed.
                // For now, just store it.
            },

            // ============================================================
            // CUSTOMERS
            // ============================================================
            loadCustomers: function() {
                this._getAll('customers').then(customers => {
                    this.customers = customers || [];
                    this.populateCustomerDropdown();
                });
            },

            populateCustomerDropdown: function() {
                const sel = document.getElementById('customerSelect');
                const currentVal = sel.value;
                sel.innerHTML = '<option value="">-- Select Customer --</option>';
                (this.customers || []).forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = c.name + (c.company ? ' (' + c.company + ')' : '');
                    sel.appendChild(opt);
                });
                if (currentVal) sel.value = currentVal;
            },

            onCustomerSelect: function(customerId) {
                if (!customerId) {
                    // clear fields
                    document.getElementById('custName').value = '';
                    document.getElementById('custCompany').value = '';
                    document.getElementById('custPhone').value = '';
                    document.getElementById('custWhatsApp').value = '';
                    document.getElementById('custEmail').value = '';
                    document.getElementById('custAddress').value = '';
                    document.getElementById('custLandmark').value = '';
                    document.getElementById('custPincode').value = '';
                    document.getElementById('custGstin').value = '';
                    return;
                }
                const customer = this.customers.find(c => c.id == customerId);
                if (customer) {
                    document.getElementById('custName').value = customer.name || '';
                    document.getElementById('custCompany').value = customer.company || '';
                    document.getElementById('custPhone').value = customer.phone || '';
                    document.getElementById('custWhatsApp').value = customer.whatsapp || '';
                    document.getElementById('custEmail').value = customer.email || '';
                    document.getElementById('custAddress').value = customer.address || '';
                    document.getElementById('custLandmark').value = customer.landmark || '';
                    document.getElementById('custPincode').value = customer.pincode || '';
                    document.getElementById('custGstin').value = customer.gstin || '';
                }
            },

            // ---- New Customer Modal ----
            showNewCustomerModal: function() {
                document.getElementById('newCustomerModal').style.display = 'flex';
                // clear fields
                ['newCustName','newCustCompany','newCustPhone','newCustWhatsApp',
                 'newCustEmail','newCustAddress','newCustLandmark','newCustPincode','newCustGstin']
                    .forEach(id => document.getElementById(id).value = '');
            },
            closeNewCustomerModal: function() {
                document.getElementById('newCustomerModal').style.display = 'none';
            },
            saveNewCustomer: function() {
                const name = document.getElementById('newCustName').value.trim();
                if (!name) { alert('Customer name is required'); return; }
                const customer = {
                    name: name,
                    company: document.getElementById('newCustCompany').value.trim(),
                    phone: document.getElementById('newCustPhone').value.trim(),
                    whatsapp: document.getElementById('newCustWhatsApp').value.trim(),
                    email: document.getElementById('newCustEmail').value.trim(),
                    address: document.getElementById('newCustAddress').value.trim(),
                    landmark: document.getElementById('newCustLandmark').value.trim(),
                    pincode: document.getElementById('newCustPincode').value.trim(),
                    gstin: document.getElementById('newCustGstin').value.trim()
                };
                this._put('customers', customer).then(id => {
                    this.loadCustomers().then(() => {
                        // select the new customer
                        const sel = document.getElementById('customerSelect');
                        sel.value = id;
                        this.onCustomerSelect(id);
                        this.closeNewCustomerModal();
                    });
                }).catch(err => alert('Error saving customer: ' + err.message));
            },

            // ============================================================
            // PRODUCTS
            // ============================================================
            loadProducts: function() {
                this._getAll('products').then(products => {
                    this.products = products || [];
                    this.populateProductDropdowns();
                });
            },

            populateProductDropdowns: function() {
                // Called whenever a new item row is added or products updated.
                // We'll populate all product selects in the items table.
                const selects = document.querySelectorAll('.product-select');
                selects.forEach(sel => {
                    const currentVal = sel.value;
                    sel.innerHTML = '<option value="">-- Product --</option>';
                    (this.products || []).forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name + (p.category ? ' (' + p.category + ')' : '');
                        sel.appendChild(opt);
                    });
                    if (currentVal) sel.value = currentVal;
                });
            },

            onProductSelect: function(selectEl) {
                const row = selectEl.closest('tr');
                const productId = selectEl.value;
                if (!productId) return;
                const product = this.products.find(p => p.id == productId);
                if (!product) return;
                // Fill description, unit, rate, gst, hsn
                const descCell = row.querySelector('.item-desc');
                if (descCell) descCell.value = product.description || product.name;
                const unitCell = row.querySelector('.item-unit');
                if (unitCell) unitCell.value = product.unit || '';
                const rateCell = row.querySelector('.item-rate');
                if (rateCell) {
                    // check price slabs
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 1;
                    const rate = this.getProductRate(product, qty);
                    rateCell.value = rate;
                }
                const gstCell = row.querySelector('.item-gst');
                if (gstCell) gstCell.value = product.gst || 0;
                // HSN/SAC could be stored in a hidden field, but we'll just store in description
                this.recalcItemRow(row);
                this.recalcTotals();
            },

            getProductRate: function(product, qty) {
                if (!product.priceSlabs || product.priceSlabs.length === 0) {
                    return product.sellingRate || 0;
                }
                // Sort slabs by minQty descending
                const sorted = [...product.priceSlabs].sort((a,b) => b.minQty - a.minQty);
                for (let slab of sorted) {
                    if (qty >= slab.minQty) {
                        return slab.rate;
                    }
                }
                return product.sellingRate || 0;
            },

            // ============================================================
            // ITEMS TABLE MANAGEMENT
            // ============================================================
            addItemRow: function(data) {
                // data: optional object with productId, qty, rate, discount, gst, description, unit
                const tbody = document.getElementById('itemsBody');
                const rowCount = tbody.children.length;
                const row = document.createElement('tr');
                const idx = rowCount + 1;
                row.innerHTML = `
                    <td class="text-center">${idx}</td>
                    <td>
                        <select class="product-select" style="width:100%;" onchange="H4Invoice.onProductSelect(this)">
                            <option value="">-- Product --</option>
                        </select>
                        <input class="item-desc" placeholder="Description" style="width:100%;margin-top:4px;" value="${data?.description || ''}">
                    </td>
                    <td><input class="item-qty" type="number" step="0.01" min="0" value="${data?.qty || 1}" onchange="H4Invoice.recalcItemRow(this.closest('tr')); H4Invoice.recalcTotals();"></td>
                    <td><input class="item-unit" placeholder="Unit" value="${data?.unit || ''}" style="width:70px;"></td>
                    <td><input class="item-rate" type="number" step="0.01" min="0" value="${data?.rate || 0}" onchange="H4Invoice.recalcItemRow(this.closest('tr')); H4Invoice.recalcTotals();"></td>
                    <td><input class="item-disc" type="number" step="0.01" min="0" value="${data?.discount || 0}" onchange="H4Invoice.recalcItemRow(this.closest('tr')); H4Invoice.recalcTotals();"></td>
                    <td><input class="item-gst" type="number" step="0.01" min="0" value="${data?.gst || 0}" onchange="H4Invoice.recalcItemRow(this.closest('tr')); H4Invoice.recalcTotals();"></td>
                    <td class="amount-cell item-amount">0.00</td>
                    <td><button class="btn btn-danger btn-sm" onclick="H4Invoice.deleteItemRow(this.closest('tr'))">✕</button></td>
                `;
                tbody.appendChild(row);
                // populate product dropdowns
                this.populateProductDropdowns();
                // If data has productId, select it
                if (data && data.productId) {
                    const sel = row.querySelector('.product-select');
                    sel.value = data.productId;
                    this.onProductSelect(sel);
                }
                // Recalc
                this.recalcItemRow(row);
                this.recalcTotals();
            },

            deleteItemRow: function(row) {
                if (document.getElementById('itemsBody').children.length <= 1) {
                    alert('At least one item row is required.');
                    return;
                }
                row.remove();
                this.recalcTotals();
                this.renumberRows();
            },

            renumberRows: function() {
                const rows = document.querySelectorAll('#itemsBody tr');
                rows.forEach((row, i) => {
                    row.cells[0].textContent = i + 1;
                });
            },

            recalcItemRow: function(row) {
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const disc = parseFloat(row.querySelector('.item-disc').value) || 0;
                const gst = parseFloat(row.querySelector('.item-gst').value) || 0;
                const amount = qty * rate;
                const discAmount = amount * (disc / 100);
                const afterDisc = amount - discAmount;
                const gstAmount = afterDisc * (gst / 100);
                const total = afterDisc + gstAmount;
                row.querySelector('.item-amount').textContent = total.toFixed(2);
                // store for later saving
                row.dataset.amount = total;
                row.dataset.qty = qty;
                row.dataset.rate = rate;
                row.dataset.disc = disc;
                row.dataset.gst = gst;
                row.dataset.afterDisc = afterDisc;
                row.dataset.gstAmount = gstAmount;
            },

            // ============================================================
            // CALCULATIONS
            // ============================================================
            recalcTotals: function() {
                const rows = document.querySelectorAll('#itemsBody tr');
                let subtotal = 0;
                let totalDisc = 0;
                let totalAfterDisc = 0;
                let totalGst = 0;
                let totalCgst = 0, totalSgst = 0, totalIgst = 0;
                rows.forEach(row => {
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                    const disc = parseFloat(row.querySelector('.item-disc').value) || 0;
                    const gst = parseFloat(row.querySelector('.item-gst').value) || 0;
                    const amt = qty * rate;
                    const discAmt = amt * (disc / 100);
                    const afterDisc = amt - discAmt;
                    const gstAmt = afterDisc * (gst / 100);
                    subtotal += amt;
                    totalDisc += discAmt;
                    totalAfterDisc += afterDisc;
                    totalGst += gstAmt;
                    // split GST (assuming CGST/SGST half each for intra-state, IGST for inter)
                    // For simplicity, we treat CGST/SGST as half of total GST, IGST as full
                    // In a real scenario, we'd have a toggle. We'll show all three.
                    totalCgst += gstAmt / 2;
                    totalSgst += gstAmt / 2;
                    totalIgst += 0; // not automatically computed
                });
                const taxable = totalAfterDisc;
                const discountTotal = totalDisc;
                const cgst = totalCgst;
                const sgst = totalSgst;
                const igst = totalIgst;
                const roundOff = parseFloat(document.getElementById('calcRoundOff').value) || 0;
                const grandTotal = taxable + cgst + sgst + igst + roundOff;

                document.getElementById('calcSubtotal').value = subtotal.toFixed(2);
                document.getElementById('calcDiscount').value = discountTotal.toFixed(2);
                document.getElementById('calcTaxable').value = taxable.toFixed(2);
                document.getElementById('calcCgst').value = cgst.toFixed(2);
                document.getElementById('calcSgst').value = sgst.toFixed(2);
                document.getElementById('calcIgst').value = igst.toFixed(2);
                document.getElementById('calcGrandTotal').value = grandTotal.toFixed(2);

                // Amount in words
                document.getElementById('calcAmountWords').value = this.numberToWords(grandTotal);

                // Update payment balance
                this.updatePaymentBalance();
            },

            updatePaymentBalance: function() {
                const grandTotal = parseFloat(document.getElementById('calcGrandTotal').value) || 0;
                const paid = parseFloat(document.getElementById('payPaid').value) || 0;
                const balance = grandTotal - paid;
                document.getElementById('payBalance').value = balance.toFixed(2);
                // update status dropdown based on balance
                const status = document.getElementById('payStatus');
                if (balance <= 0.01) status.value = 'Paid';
                else if (paid > 0) status.value = 'Partially Paid';
                else status.value = 'Unpaid';
            },

            // ---- number to words (Indian rupees) ----
            numberToWords: function(num) {
                if (num === 0) return 'Zero';
                const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
                const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
                const units = ['','Thousand','Lakh','Crore'];
                const numStr = Math.round(num).toString();
                // simple conversion up to crore
                let words = '';
                const len = numStr.length;
                if (len > 9) return 'Number too large';
                // split into groups of 3 from right
                const groups = [];
                let i = len;
                while (i > 0) {
                    const start = Math.max(0, i-3);
                    groups.push(numStr.substring(start, i));
                    i -= 3;
                }
                groups.reverse();
                const groupNames = ['','Thousand','Lakh','Crore']; // but need mapping
                // Actually we'll use a standard approach
                const n = parseInt(numStr);
                if (n === 0) return 'Zero';
                let res = '';
                const crore = Math.floor(n / 10000000);
                const lakh = Math.floor((n % 10000000) / 100000);
                const thousand = Math.floor((n % 100000) / 1000);
                const remainder = n % 1000;
                if (crore > 0) res += this._convertHundreds(crore) + ' Crore ';
                if (lakh > 0) res += this._convertHundreds(lakh) + ' Lakh ';
                if (thousand > 0) res += this._convertHundreds(thousand) + ' Thousand ';
                if (remainder > 0) res += this._convertHundreds(remainder);
                return res.trim() + ' Only';
            },
            _convertHundreds: function(num) {
                const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
                const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
                let str = '';
                if (num >= 100) {
                    str += a[Math.floor(num/100)] + ' Hundred ';
                    num %= 100;
                }
                if (num >= 20) {
                    str += b[Math.floor(num/10)] + ' ';
                    num %= 10;
                }
                if (num > 0) {
                    str += a[num] + ' ';
                }
                return str.trim();
            },

            // ============================================================
            // STEP NAVIGATION
            // ============================================================
            goStep: function(step) {
                this.currentStep = step;
                // hide all panels
                document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
                const panel = document.querySelector(`.step-panel[data-step="${step}"]`);
                if (panel) panel.classList.add('active');
                // update tabs
                document.querySelectorAll('.wizard-tabs button').forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.step) === step);
                });
                // if step 7, render preview
                if (step === 7) {
                    this.renderPreview();
                }
                // if step 4, recalc totals
                if (step === 4) {
                    this.recalcTotals();
                }
                // if step 5, update payment balance
                if (step === 5) {
                    this.updatePaymentBalance();
                }
                // scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            attachEvents: function() {
                // Customer select change
                document.getElementById('customerSelect').addEventListener('change', function() {
                    H4Invoice.onCustomerSelect(this.value);
                });
                // Discount change
                document.getElementById('calcDiscount').addEventListener('input', function() {
                    H4Invoice.recalcTotals();
                });
                // Round off change
                document.getElementById('calcRoundOff').addEventListener('input', function() {
                    H4Invoice.recalcTotals();
                });
                // Paid amount change
                document.getElementById('payPaid').addEventListener('input', function() {
                    H4Invoice.updatePaymentBalance();
                });
                // Template change
                document.getElementById('invTemplate').addEventListener('change', function() {
                    if (H4Invoice.currentStep === 7) H4Invoice.renderPreview();
                });
            },

            // ============================================================
            // SAVE INVOICE
            // ============================================================
            saveInvoice: function() {
                // Gather all data
                const number = document.getElementById('invNumber').value.trim();
                if (!number) { alert('Invoice Number is required.'); return; }
                const date = document.getElementById('invDate').value;
                const dueDate = document.getElementById('invDueDate').value;
                const ref = document.getElementById('invRef').value.trim();
                const project = document.getElementById('invProject').value.trim();
                const templateId = document.getElementById('invTemplate').value;

                const customerId = document.getElementById('customerSelect').value || null;
                const custName = document.getElementById('custName').value.trim();
                if (!custName) { alert('Customer name is required.'); return; }
                const custData = {
                    name: custName,
                    company: document.getElementById('custCompany').value.trim(),
                    phone: document.getElementById('custPhone').value.trim(),
                    whatsapp: document.getElementById('custWhatsApp').value.trim(),
                    email: document.getElementById('custEmail').value.trim(),
                    address: document.getElementById('custAddress').value.trim(),
                    landmark: document.getElementById('custLandmark').value.trim(),
                    pincode: document.getElementById('custPincode').value.trim(),
                    gstin: document.getElementById('custGstin').value.trim()
                };

                // Items
                const items = [];
                const rows = document.querySelectorAll('#itemsBody tr');
                rows.forEach(row => {
                    const desc = row.querySelector('.item-desc').value.trim();
                    if (!desc) return;
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const unit = row.querySelector('.item-unit').value.trim();
                    const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                    const disc = parseFloat(row.querySelector('.item-disc').value) || 0;
                    const gst = parseFloat(row.querySelector('.item-gst').value) || 0;
                    const amount = parseFloat(row.dataset.amount) || 0;
                    const productId = row.querySelector('.product-select').value || null;
                    items.push({
                        productId: productId,
                        description: desc,
                        qty: qty,
                        unit: unit,
                        rate: rate,
                        discount: disc,
                        gst: gst,
                        amount: amount
                    });
                });
                if (items.length === 0) { alert('Add at least one item.'); return; }

                const subtotal = parseFloat(document.getElementById('calcSubtotal').value) || 0;
                const discountAmount = parseFloat(document.getElementById('calcDiscount').value) || 0;
                const taxableAmount = parseFloat(document.getElementById('calcTaxable').value) || 0;
                const cgst = parseFloat(document.getElementById('calcCgst').value) || 0;
                const sgst = parseFloat(document.getElementById('calcSgst').value) || 0;
                const igst = parseFloat(document.getElementById('calcIgst').value) || 0;
                const roundOff = parseFloat(document.getElementById('calcRoundOff').value) || 0;
                const grandTotal = parseFloat(document.getElementById('calcGrandTotal').value) || 0;
                const amountWords = document.getElementById('calcAmountWords').value;

                const paidAmount = parseFloat(document.getElementById('payPaid').value) || 0;
                const balanceAmount = parseFloat(document.getElementById('payBalance').value) || 0;
                const paymentStatus = document.getElementById('payStatus').value;

                const terms = document.getElementById('notesTerms').value.trim();
                const bankDetails = document.getElementById('notesBank').value.trim();
                const notes = document.getElementById('notesExtra').value.trim();

                // Build invoice object
                const invoice = {
                    number: number,
                    date: date,
                    dueDate: dueDate,
                    reference: ref,
                    projectName: project,
                    customerId: customerId,
                    customer: custData,
                    items: items,
                    subtotal: subtotal,
                    discountAmount: discountAmount,
                    taxableAmount: taxableAmount,
                    cgst: cgst,
                    sgst: sgst,
                    igst: igst,
                    roundOff: roundOff,
                    grandTotal: grandTotal,
                    amountWords: amountWords,
                    paidAmount: paidAmount,
                    balanceAmount: balanceAmount,
                    paymentStatus: paymentStatus,
                    terms: terms,
                    bankDetails: bankDetails,
                    notes: notes,
                    templateId: templateId,
                    templateVersion: 1,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                if (this.editingInvoiceId) {
                    invoice.id = this.editingInvoiceId;
                }

                this._put('invoices', invoice).then(id => {
                    alert('Invoice saved successfully!');
                    this.editingInvoiceId = id;
                    document.getElementById('invoiceStatusBadge').textContent = paymentStatus;
                    // Update invoice number? We could generate next number, but we'll let user manage.
                    this.goStep(7);
                }).catch(err => {
                    alert('Error saving invoice: ' + err.message);
                });
            },

            // ============================================================
            // PREVIEW RENDER
            // ============================================================
            renderPreview: function() {
                // Gather current data from form (same as save but we render)
                const number = document.getElementById('invNumber').value || 'INV-0001';
                const date = document.getElementById('invDate').value || new Date().toISOString().slice(0,10);
                const dueDate = document.getElementById('invDueDate').value || '';
                const ref = document.getElementById('invRef').value || '';
                const project = document.getElementById('invProject').value || '';
                const templateId = document.getElementById('invTemplate').value || 'modern';

                const custName = document.getElementById('custName').value || 'Customer';
                const custCompany = document.getElementById('custCompany').value || '';
                const custPhone = document.getElementById('custPhone').value || '';
                const custWhatsApp = document.getElementById('custWhatsApp').value || '';
                const custEmail = document.getElementById('custEmail').value || '';
                const custAddress = document.getElementById('custAddress').value || '';
                const custLandmark = document.getElementById('custLandmark').value || '';
                const custPincode = document.getElementById('custPincode').value || '';
                const custGstin = document.getElementById('custGstin').value || '';

                // Items
                const rows = document.querySelectorAll('#itemsBody tr');
                const items = [];
                rows.forEach(row => {
                    const desc = row.querySelector('.item-desc').value.trim();
                    if (!desc) return;
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const unit = row.querySelector('.item-unit').value.trim();
                    const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                    const disc = parseFloat(row.querySelector('.item-disc').value) || 0;
                    const gst = parseFloat(row.querySelector('.item-gst').value) || 0;
                    const amount = parseFloat(row.dataset.amount) || 0;
                    items.push({ description: desc, qty, unit, rate, discount: disc, gst, amount });
                });

                const subtotal = parseFloat(document.getElementById('calcSubtotal').value) || 0;
                const discountAmount = parseFloat(document.getElementById('calcDiscount').value) || 0;
                const taxableAmount = parseFloat(document.getElementById('calcTaxable').value) || 0;
                const cgst = parseFloat(document.getElementById('calcCgst').value) || 0;
                const sgst = parseFloat(document.getElementById('calcSgst').value) || 0;
                const igst = parseFloat(document.getElementById('calcIgst').value) || 0;
                const roundOff = parseFloat(document.getElementById('calcRoundOff').value) || 0;
                const grandTotal = parseFloat(document.getElementById('calcGrandTotal').value) || 0;
                const amountWords = document.getElementById('calcAmountWords').value;

                const terms = document.getElementById('notesTerms').value || '';
                const bankDetails = document.getElementById('notesBank').value || '';
                const notes = document.getElementById('notesExtra').value || '';

                // Company data
                const company = this.company || {};
                const showLogo = company.showLogo !== false;
                const showSignature = company.showSignature !== false;

                // Build HTML
                const preview = document.getElementById('invoicePreview');
                // Apply template class
                preview.className = 'a4-paper template-' + templateId;

                let html = `
                    <div class="invoice-header">
                        <div class="company-info">
                            ${showLogo && company.logo ? `<img src="${company.logo}" alt="Logo" class="company-logo">` : ''}
                            <div class="company-text">
                                <h2>${company.brandName || company.legalName || 'H4 Construction'}</h2>
                                <div class="sub">${company.legalName || ''}</div>
                                <div class="sub">${company.address || ''}${company.landmark ? ', '+company.landmark : ''}${company.city ? ', '+company.city : ''}${company.state ? ', '+company.state : ''} - ${company.pincode || ''}</div>
                                <div class="sub">📞 ${company.phone || ''} ${company.whatsapp ? '| 💬 '+company.whatsapp : ''} ${company.email ? '| ✉ '+company.email : ''}</div>
                                <div class="sub">GST: ${company.gstin || ''} | ${company.website || ''}</div>
                            </div>
                        </div>
                        <div class="doc-title">
                            <h3>TAX INVOICE</h3>
                            <div class="meta">Invoice #: ${number}</div>
                            <div class="meta">Date: ${date}</div>
                            ${dueDate ? `<div class="meta">Due: ${dueDate}</div>` : ''}
                            ${ref ? `<div class="meta">Ref: ${ref}</div>` : ''}
                            ${project ? `<div class="meta">Project: ${project}</div>` : ''}
                        </div>
                    </div>
                    <div class="bill-to">
                        <strong>Bill To:</strong>
                        <div>${custName}${custCompany ? ', '+custCompany : ''}</div>
                        <div>${custAddress}${custLandmark ? ', '+custLandmark : ''}${custPincode ? ' - '+custPincode : ''}</div>
                        <div>📞 ${custPhone} ${custWhatsApp ? '| 💬 '+custWhatsApp : ''} ${custEmail ? '| ✉ '+custEmail : ''}</div>
                        ${custGstin ? `<div>GSTIN: ${custGstin}</div>` : ''}
                    </div>
                    <table class="items">
                        <thead>
                            <tr><th>#</th><th>Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Disc %</th><th>GST %</th><th class="amount">Amount</th></tr>
                        </thead>
                        <tbody>
                `;
                items.forEach((item, i) => {
                    html += `
                        <tr>
                            <td>${i+1}</td>
                            <td>${item.description}</td>
                            <td>${item.qty}</td>
                            <td>${item.unit || '-'}</td>
                            <td>₹${item.rate.toFixed(2)}</td>
                            <td>${item.discount > 0 ? item.discount+'%' : '-'}</td>
                            <td>${item.gst > 0 ? item.gst+'%' : '-'}</td>
                            <td class="amount">₹${item.amount.toFixed(2)}</td>
                        </tr>
                    `;
                });
                html += `
                        </tbody>
                    </table>
                    <div class="totals">
                        <div class="row"><span class="label">Subtotal</span><span class="value">₹${subtotal.toFixed(2)}</span></div>
                        <div class="row"><span class="label">Discount</span><span class="value">₹${discountAmount.toFixed(2)}</span></div>
                        <div class="row"><span class="label">Taxable Amount</span><span class="value">₹${taxableAmount.toFixed(2)}</span></div>
                        <div class="row"><span class="label">CGST</span><span class="value">₹${cgst.toFixed(2)}</span></div>
                        <div class="row"><span class="label">SGST</span><span class="value">₹${sgst.toFixed(2)}</span></div>
                        ${igst > 0 ? `<div class="row"><span class="label">IGST</span><span class="value">₹${igst.toFixed(2)}</span></div>` : ''}
                        <div class="row"><span class="label">Round Off</span><span class="value">₹${roundOff.toFixed(2)}</span></div>
                        <div class="row grand-total"><span class="label">Grand Total</span><span class="value">₹${grandTotal.toFixed(2)}</span></div>
                    </div>
                    <div class="amount-words">${amountWords}</div>
                    <div style="margin:10px 0;font-size:10pt;white-space:pre-wrap;">${terms ? 'Terms: '+terms : ''}</div>
                    <div style="margin:6px 0;font-size:10pt;white-space:pre-wrap;">${bankDetails ? 'Bank Details:\n'+bankDetails : ''}</div>
                    <div style="margin:6px 0;font-size:10pt;white-space:pre-wrap;">${notes ? 'Notes: '+notes : ''}</div>
                    <div class="footer">
                        <div>${company.legalName || ''}</div>
                        <div class="signature">
                            ${company.authorizedSignatory ? 'Authorized Signatory' : ''}
                            ${showSignature && company.signature ? `<br><img src="${company.signature}" alt="Signature" style="max-height:40px;">` : ''}
                            ${!company.signature && company.authorizedSignatory ? `<br>${company.authorizedSignatory}` : ''}
                        </div>
                    </div>
                `;
                preview.innerHTML = html;
            },

            // ============================================================
            // PRINT / PDF
            // ============================================================
            printInvoice: function() {
                window.print();
            },

            // ============================================================
            // WHATSAPP SHARE
            // ============================================================
            shareWhatsApp: function() {
                const number = document.getElementById('invNumber').value || 'Invoice';
                const grandTotal = document.getElementById('calcGrandTotal').value || '0';
                const custName = document.getElementById('custName').value || 'Customer';
                const company = this.company || {};
                const msg = `Dear ${custName},\n\nPlease find your invoice.\nInvoice No: ${number}\nAmount: ₹${grandTotal}\n\nThank you.\n${company.legalName || 'H4 Construction Solutions'}`;

                // Use Web Share API if available
                if (navigator.share) {
                    navigator.share({
                        title: 'Invoice ' + number,
                        text: msg,
                        // we could share a generated PDF file, but we'll just send text
                    }).catch(err => console.log('Share cancelled'));
                } else {
                    // Fallback: WhatsApp URL (mobile)
                    const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
                    window.open(url, '_blank');
                }
            },

            // ============================================================
            // INVOICE LIST (simple)
            // ============================================================
            loadInvoiceList: function() {
                this._getAll('invoices').then(invoices => {
                    if (!invoices || invoices.length === 0) {
                        alert('No invoices found.');
                        return;
                    }
                    let list = '📋 Invoices:\n\n';
                    invoices.forEach((inv, i) => {
                        list += `${i+1}. ${inv.number} | ${inv.date} | ₹${inv.grandTotal} | ${inv.paymentStatus}\n`;
                    });
                    list += '\nClick OK to view the first invoice in preview.';
                    if (confirm(list)) {
                        // Load first invoice into editor
                        const first = invoices[0];
                        this.loadInvoiceForEdit(first.id);
                    }
                }).catch(err => alert('Error loading invoices: ' + err.message));
            },

            loadInvoiceForEdit: function(id) {
                this._getAll('invoices').then(invoices => {
                    const inv = invoices.find(i => i.id == id);
                    if (!inv) { alert('Invoice not found'); return; }
                    this.editingInvoiceId = id;
                    // Populate form
                    document.getElementById('invNumber').value = inv.number || '';
                    document.getElementById('invDate').value = inv.date || '';
                    document.getElementById('invDueDate').value = inv.dueDate || '';
                    document.getElementById('invRef').value = inv.reference || '';
                    document.getElementById('invProject').value = inv.projectName || '';
                    document.getElementById('invTemplate').value = inv.templateId || 'modern';

                    // Customer
                    if (inv.customerId) {
                        const sel = document.getElementById('customerSelect');
                        sel.value = inv.customerId;
                        this.onCustomerSelect(inv.customerId);
                    } else if (inv.customer) {
                        document.getElementById('custName').value = inv.customer.name || '';
                        document.getElementById('custCompany').value = inv.customer.company || '';
                        document.getElementById('custPhone').value = inv.customer.phone || '';
                        document.getElementById('custWhatsApp').value = inv.customer.whatsapp || '';
                        document.getElementById('custEmail').value = inv.customer.email || '';
                        document.getElementById('custAddress').value = inv.customer.address || '';
                        document.getElementById('custLandmark').value = inv.customer.landmark || '';
                        document.getElementById('custPincode').value = inv.customer.pincode || '';
                        document.getElementById('custGstin').value = inv.customer.gstin || '';
                    }

                    // Items: clear and add rows
                    const tbody = document.getElementById('itemsBody');
                    tbody.innerHTML = '';
                    inv.items.forEach((item, idx) => {
                        if (idx === 0) {
                            // use first row
                            const row = tbody.querySelector('tr');
                            if (row) {
                                row.querySelector('.item-desc').value = item.description || '';
                                row.querySelector('.item-qty').value = item.qty || 1;
                                row.querySelector('.item-unit').value = item.unit || '';
                                row.querySelector('.item-rate').value = item.rate || 0;
                                row.querySelector('.item-disc').value = item.discount || 0;
                                row.querySelector('.item-gst').value = item.gst || 0;
                                if (item.productId) {
                                    const sel = row.querySelector('.product-select');
                                    sel.value = item.productId;
                                    this.onProductSelect(sel);
                                }
                                this.recalcItemRow(row);
                            }
                        } else {
                            this.addItemRow({
                                productId: item.productId || null,
                                description: item.description || '',
                                qty: item.qty || 1,
                                unit: item.unit || '',
                                rate: item.rate || 0,
                                discount: item.discount || 0,
                                gst: item.gst || 0
                            });
                        }
                    });

                    // Totals
                    document.getElementById('calcSubtotal').value = inv.subtotal || 0;
                    document.getElementById('calcDiscount').value = inv.discountAmount || 0;
                    document.getElementById('calcTaxable').value = inv.taxableAmount || 0;
                    document.getElementById('calcCgst').value = inv.cgst || 0;
                    document.getElementById('calcSgst').value = inv.sgst || 0;
                    document.getElementById('calcIgst').value = inv.igst || 0;
                    document.getElementById('calcRoundOff').value = inv.roundOff || 0;
                    document.getElementById('calcGrandTotal').value = inv.grandTotal || 0;
                    document.getElementById('calcAmountWords').value = inv.amountWords || '';

                    document.getElementById('payPaid').value = inv.paidAmount || 0;
                    document.getElementById('payBalance').value = inv.balanceAmount || 0;
                    document.getElementById('payStatus').value = inv.paymentStatus || 'Unpaid';

                    document.getElementById('notesTerms').value = inv.terms || '';
                    document.getElementById('notesBank').value = inv.bankDetails || '';
                    document.getElementById('notesExtra').value = inv.notes || '';

                    document.getElementById('invoiceStatusBadge').textContent = inv.paymentStatus || 'Draft';

                    alert('Invoice loaded for editing. Go to Preview to see it.');
                    this.goStep(7);
                }).catch(err => alert('Error loading invoice: ' + err.message));
            },

            // ============================================================
            // HELPERS
            // ============================================================
            setDefaultDates: function() {
                const today = new Date().toISOString().slice(0,10);
                document.getElementById('invDate').value = today;
                const due = new Date();
                due.setDate(due.getDate() + 15);
                document.getElementById('invDueDate').value = due.toISOString().slice(0,10);
                // Default invoice number
                const num = 'INV-' + new Date().getFullYear() + '-' + String(Math.floor(Math.random()*10000)).padStart(4,'0');
                document.getElementById('invNumber').value = num;
            }
        };

        // Expose globally
        window.H4Invoice = H4Invoice;

        // Auto-init on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => H4Invoice.init());
        } else {
            H4Invoice.init();
        }

    })();
</script>

</body>
</html>
